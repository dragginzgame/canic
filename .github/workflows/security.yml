name: Scheduled dependency security

env:
  CANIC_INTERNAL_TOOLCHAIN: 1.97.1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-targets: false
      - name: Install dependency-audit tools
        shell: bash
        run: |
          source tool-versions.env
          cargo install cargo-audit --version "$CANIC_CARGO_AUDIT_VERSION" --locked
          cargo install ripgrep --version "$CANIC_RIPGREP_VERSION" --locked --features pcre2
      - name: Check dependency risk inventory
        shell: bash
        run: bash scripts/ci/check-dependency-risk-inventory.sh
