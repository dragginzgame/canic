name: Scheduled dependency security

env:
  CANIC_INTERNAL_TOOLCHAIN: 1.99.1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-targets: false
      - name: Install dependency-audit tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          cargo install cargo-audit --version "$CANIC_CARGO_AUDIT_VERSION" --locked
      - name: Check dependency risk inventory
        shell: bash
        run: bash scripts/ci/check-dependency-risk-inventory.sh
