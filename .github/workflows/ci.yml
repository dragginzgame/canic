name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  policy-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
      - name: Prepare pinned policy tools
        run: |
          make install-host-tools host-tools-check
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh --toolchain-file rust-toolchain.toml
          actionlint_bin="$(bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh actionlint --install-dir "$RUNNER_TEMP/ci-tools")"
          gitleaks_bin="$(bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh gitleaks --install-dir "$RUNNER_TEMP/ci-tools")"
          echo "ACTIONLINT_BIN=$actionlint_bin" >> "$GITHUB_ENV"
          echo "GITLEAKS_BIN=$gitleaks_bin" >> "$GITHUB_ENV"
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Admit snapshot, pins and workflow
        run: |
          make toko-tooling-check check-pins
          "$ACTIONLINT_BIN" -shellcheck= .github/workflows/ci.yml
      - name: Scan complete repository history once
        run: '"$GITLEAKS_BIN" git --redact=100 --no-banner --no-color --log-level error "$GITHUB_WORKSPACE"'

  product:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
      - name: Prepare pinned compiler and common tools
        run: |
          make install-host-tools host-tools-check
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          bash vendor/toko-tooling/scripts/dev/prepare-rust-toolchain.sh --toolchain-file rust-toolchain.toml
          rustup target add wasm32-unknown-unknown
          make install-rust-tools rust-tools-check
      - uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Admit sources and check formatting
        run: make toko-tooling-check fmt-check
      - name: Prepare locked dependencies
        env:
          CANIC_BLOB_DEPLOY_KEY: ${{ secrets.CANIC_BLOB_DEPLOY_KEY }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_TERMINAL_PROMPT: '0'
        run: |
          test -n "$CANIC_BLOB_DEPLOY_KEY" || {
            echo 'Configure CANIC_BLOB_DEPLOY_KEY with read-only access to ic-blob-storage.' >&2
            exit 1
          }
          umask 077
          key_file="$(mktemp "$RUNNER_TEMP/canic-blob-key.XXXXXX")"
          trap 'rm -f -- "$key_file"' EXIT
          printf '%s\n' "$CANIC_BLOB_DEPLOY_KEY" > "$key_file"
          unset CANIC_BLOB_DEPLOY_KEY
          printf -v GIT_SSH_COMMAND 'ssh -F /dev/null -i %q -p 443 -o Hostname=ssh.github.com -o HostKeyAlias=github.com -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%q' "$key_file" "$GITHUB_WORKSPACE/ci/github-known-hosts"
          export GIT_SSH_COMMAND
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=url.ssh://git@github.com/dragginzgame/ic-blob-storage.insteadOf
          export GIT_CONFIG_VALUE_0=https://github.com/dragginzgame/ic-blob-storage
          cargo fetch --locked
      - name: Native product checks
        run: make ci-native
      - name: Wasm product checks
        run: make ci-wasm
