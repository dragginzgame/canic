name: CI

env:
  CANIC_MSRV: 1.91.0
  CANIC_INTERNAL_TOOLCHAIN: 1.97.1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Install preflight tools
        shell: bash
        run: |
          source tool-versions.env
          cargo install cargo-get --version "$CANIC_CARGO_GET_VERSION" --locked
          cargo install ripgrep --version "$CANIC_RIPGREP_VERSION" --locked --features pcre2
          ACTIONLINT_BIN="$(bash scripts/ci/install-actionlint.sh)"
          SHELLCHECK_BIN="$(bash scripts/ci/install-shellcheck.sh)"
          echo "ACTIONLINT_BIN=$ACTIONLINT_BIN" >> "$GITHUB_ENV"
          echo "SHELLCHECK_BIN=$SHELLCHECK_BIN" >> "$GITHUB_ENV"
      - name: Check preflight tools
        shell: bash
        run: |
          cargo get --version
          rg --version
          rg --pcre2-version
          "$ACTIONLINT_BIN" -version
          "$SHELLCHECK_BIN" --version
      - name: Lint GitHub Actions workflows
        shell: bash
        run: "$ACTIONLINT_BIN"
      - name: Lint repository shell automation
        shell: bash
        run: >-
          "$SHELLCHECK_BIN" --exclude=SC2001,SC2016
          scripts/ci/*.sh scripts/dev/*.sh .githooks/pre-commit
      - name: Layering guards
        shell: bash
        run: bash scripts/ci/run-layering-guards.sh
      - name: Current document semantics guard
        shell: bash
        run: bash scripts/ci/check-current-document-semantics.sh
      - name: Blob storage inventory gate
        shell: bash
        run: bash scripts/ci/check-blob-storage-inventory-gate.sh
      - name: Blob storage Cashier inventory gate
        shell: bash
        run: bash scripts/ci/check-blob-storage-cashier-inventory-gate.sh
      - name: Release validation matrix guard
        shell: bash
        run: bash scripts/ci/check-release-validation-matrix.sh
      - name: Release execution integrity guard
        shell: bash
        run: bash scripts/ci/check-release-integrity-contract.sh
      - name: Audit method catalog guard
        shell: bash
        run: bash scripts/ci/check-audit-method-catalog.sh
      - name: Recovery runbooks guard
        shell: bash
        run: bash scripts/ci/check-recovery-runbooks.sh
      - name: Workspace test inventory guard
        shell: bash
        run: bash scripts/ci/check-workspace-test-inventory.sh

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Install security tools
        shell: bash
        run: |
          source tool-versions.env
          cargo install cargo-audit --version "$CANIC_CARGO_AUDIT_VERSION" --locked
          cargo install ripgrep --version "$CANIC_RIPGREP_VERSION" --locked --features pcre2
          GITLEAKS_BIN="$(bash scripts/ci/install-gitleaks.sh)"
          echo "GITLEAKS_BIN=$GITLEAKS_BIN" >> "$GITHUB_ENV"
      - name: Check security tools
        shell: bash
        run: |
          cargo audit --version
          rg --version
          "$GITLEAKS_BIN" version
      - name: Scan repository history for secrets
        shell: bash
        run: bash scripts/ci/run-secret-scan.sh
      - name: Check dependency risk inventory
        shell: bash
        run: bash scripts/ci/check-dependency-risk-inventory.sh
      - name: Check dependency risk rejection cases
        shell: bash
        run: bash scripts/ci/test-dependency-risk-inventory.sh

  msrv:
    needs: [preflight, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_MSRV }}
      - name: Select MSRV toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$CANIC_MSRV" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Check runner disk before MSRV
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "MSRV before check" --min-free-mib 3072 --summary-only
      - name: Check workspace MSRV
        run: cargo check --workspace --locked
      - name: Report runner disk after MSRV failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "MSRV failure"

  checks:
    needs: [preflight, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Install formatting tools
        shell: bash
        run: |
          source tool-versions.env
          cargo install cargo-sort --version "$CANIC_CARGO_SORT_VERSION" --locked
          cargo install cargo-sort-derives --version "$CANIC_CARGO_SORT_DERIVES_VERSION" --locked
      - name: Check formatting tools
        shell: bash
        run: |
          cargo sort --version
          cargo sort-derives --version
      - name: Check runner disk before Rust checks
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "checks before Rust validation" --min-free-mib 4096 --summary-only
      - name: Control-plane feature matrix
        shell: bash
        run: bash scripts/ci/check-control-plane-feature-matrix.sh
      - run: make fmt-check
      - run: make clippy
      - name: Build examples (default)
        run: cargo build -p canic --examples --locked
      - name: Report runner disk after checks failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "checks failure"

  tests-ordinary:
    needs: [preflight, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Install ordinary test helper tools
        shell: bash
        run: |
          source tool-versions.env
          cargo install ripgrep --version "$CANIC_RIPGREP_VERSION" --locked --features pcre2
      - name: Check ordinary test helper tools
        shell: bash
        run: |
          rg --version
          rg --pcre2-version
      - name: Check runner disk before ordinary tests
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "ordinary tests before run" --min-free-mib 4096 --summary-only
      - name: Run workspace ordinary tests
        run: make test-ordinary
      - name: Report runner disk after ordinary-test failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "ordinary-test failure"

  tests-pocketic:
    needs: [preflight, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Install PocketIC test helper tools
        shell: bash
        run: |
          source tool-versions.env
          cargo install candid-extractor --version "$CANIC_CANDID_EXTRACTOR_VERSION" --locked
          cargo install ripgrep --version "$CANIC_RIPGREP_VERSION" --locked --features pcre2
      - name: Install wasm target
        shell: bash
        run: |
          echo "RUSTUP_TOOLCHAIN=$CANIC_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup target add --toolchain "$CANIC_INTERNAL_TOOLCHAIN" wasm32-unknown-unknown
      - name: Install IC CLI tools
        shell: bash
        run: |
          bash scripts/ci/install-icp-cli.sh
          bash scripts/ci/install-ic-wasm.sh
      - name: Check PocketIC test helper tools
        run: |
          candid-extractor --version
          icp --version
          ic-wasm --version
          rg --version
      - name: Cache PocketIC server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pocket-ic-server-*
          key: pocket-ic-${{ hashFiles('tool-versions.env') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Restore validated PocketIC test artifacts
        id: pocketic-test-artifacts
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/test-artifacts
          key: >-
            pocketic-test-artifacts-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('tool-versions.env', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            pocketic-test-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool-versions.env', 'Cargo.lock') }}-
      - name: Install PocketIC server
        shell: bash
        run: |
          BIN="$(bash scripts/ci/install-pocketic.sh)"
          echo "POCKET_IC_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Check runner disk before PocketIC tests
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "PocketIC tests before run" --min-free-mib 4096 --summary-only
      - name: Run serial PocketIC tests
        run: make test-pocketic
      - name: Save validated PocketIC test artifacts
        if: ${{ !cancelled() && steps.pocketic-test-artifacts.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/test-artifacts
          key: >-
            pocketic-test-artifacts-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('tool-versions.env', 'Cargo.lock') }}-${{ github.sha }}
      - name: Report runner disk after PocketIC-test failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "PocketIC-test failure"

  release-build:
    needs: [preflight, security]
    if: >-
      ${{ success() && github.event_name == 'push' && github.ref ==
      'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Check runner disk before release build
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "release build before compile" --min-free-mib 4096 --summary-only
      - name: Build release workspace
        run: cargo build --release --workspace --locked
      - name: Report runner disk after release-build failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "release-build failure"
