name: CI

env:
  CANIC_MSRV: 1.91.0
  CANIC_INTERNAL_TOOLCHAIN: 1.99.0
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Install preflight tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          cargo install cargo-edit --version "$CANIC_CARGO_EDIT_VERSION" --locked
          ACTIONLINT_BIN="$(bash scripts/ci/install-pinned-ci-tool.sh actionlint)"
          SHELLCHECK_BIN="$(bash scripts/ci/install-pinned-ci-tool.sh shellcheck)"
          echo "ACTIONLINT_BIN=$ACTIONLINT_BIN" >> "$GITHUB_ENV"
          echo "SHELLCHECK_BIN=$SHELLCHECK_BIN" >> "$GITHUB_ENV"
      - name: Check preflight tools
        shell: bash
        run: |
          rg --version
          rg --pcre2-version
          "$ACTIONLINT_BIN" -version
          "$SHELLCHECK_BIN" --version
      - name: Run preflight validation with complete feedback
        shell: bash
        run: make ci-preflight

  macos-host:
    needs: [preflight, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Record and verify native host
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          sw_vers
          uname -m
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
      - name: Install supported maintainer shell tools
        shell: bash
        run: |
          brew install bash coreutils gnu-sed
          {
            echo "$(brew --prefix bash)/bin"
            echo "$(brew --prefix coreutils)/libexec/gnubin"
            echo "$(brew --prefix gnu-sed)/libexec/gnubin"
          } >> "$GITHUB_PATH"
      - name: Qualify test worker failure and cancellation cleanup
        shell: bash
        run: |
          bash scripts/ci/test-pocketic-workers.sh
          bash scripts/ci/test-workspace-test-runner.sh
      - name: Install and qualify pinned native build tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          make install-rust-tools
          echo "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/rust/bin:$PATH"
          make install-ic-tools
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
          pocket_bin="$GITHUB_WORKSPACE/.tools/ic/bin/pocket-ic"
          "$pocket_bin" --version
          echo "POCKET_IC_BIN=$pocket_bin" >> "$GITHUB_ENV"
      - name: Qualify isolated formatting and safe hook setup
        shell: bash
        run: bash scripts/ci/test-git-hooks.sh
      - name: Compile Host and CLI
        run: cargo check --locked -p canic-host -p canic-cli --all-targets
      - name: Qualify Rust tool installation and executable selection
        shell: bash
        run: |
          cargo test --locked -p canic-host --lib tool_install::
          cargo test --locked -p canic-host --lib tool_resolution::
          cargo test --locked -p canic-host --lib binaryen::
          cargo test --locked -p canic-host --lib ic_wasm::
          cargo run --locked -p canic-cli --bin canic -- toolchain install
      - name: Qualify native durability and backup recovery
        shell: bash
        run: |
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p canic-host --lib fleet_ensure::ops::attempt_recovery::tests::
          cargo test --locked -p canic-cli --lib output::tests::
          cargo test --locked -p canic-cli --lib fleet::tests::generated_desired_output_
          cargo test --locked -p canic-backup --lib persistence::
          cargo test --locked -p canic-backup --lib restore::runner::
      - name: Check canister target from macOS
        run: cargo check --locked -p canic-control-plane --target wasm32-unknown-unknown --features root-control-plane
      - name: Build and finalize a representative canister artifact
        run: cargo run --locked -p canic-cli --bin canic -- build demo user_shard --environment local
      - name: Qualify one managed lifecycle through the Make PocketIC runner
        run: make test-pocketic-case CASE=pic::lifecycle::tests::published_managed_component_group_support_drives_child_lifecycle

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Install security tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          cargo install cargo-audit --version "$CANIC_CARGO_AUDIT_VERSION" --locked
      - name: Check security tools
        shell: bash
        run: |
          cargo audit --version
          rg --version
      - name: Run security validation with complete feedback
        shell: bash
        run: make ci-security

  msrv:
    needs: [preflight, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_MSRV }}
      - name: Select MSRV toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$CANIC_MSRV" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Check runner disk before MSRV
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "MSRV before check" --min-free-mib 3072 --summary-only
      - name: Check workspace MSRV
        run: bash scripts/ci/run-workspace-cargo.sh check --keep-going
      - name: Report runner disk after MSRV failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "MSRV failure"

  checks:
    needs: [preflight, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-
      - name: Install compiler cache
        shell: bash
        run: |
          bash scripts/ci/install-pinned-ci-tool.sh sccache
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/canic-sccache"
            echo "SCCACHE_CACHE_SIZE=2G"
            echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/scripts/ci/run-sccache.sh"
          } >> "$GITHUB_ENV"
      - name: Install formatting tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          make install-rust-tools
          echo "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/rust/bin:$PATH"
      - name: Check formatting tools
        shell: bash
        run: |
          cargo sort --version
          cargo sort-derives --version
      - name: Qualify isolated formatting and safe hook setup
        shell: bash
        run: bash scripts/ci/test-git-hooks.sh
      - name: Check runner disk before Rust checks
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "checks before Rust validation" --min-free-mib 4096 --summary-only
      - name: Run Rust checks with complete feedback
        shell: bash
        run: make ci-checks
      - name: Report runner disk after checks failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "checks failure"
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  tests-ordinary:
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-
      - name: Install compiler cache
        shell: bash
        run: |
          bash scripts/ci/install-pinned-ci-tool.sh sccache
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/canic-sccache"
            echo "SCCACHE_CACHE_SIZE=2G"
            echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/scripts/ci/run-sccache.sh"
          } >> "$GITHUB_ENV"
      - name: Install ordinary test helper tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          cargo install cargo-edit --version "$CANIC_CARGO_EDIT_VERSION" --locked
      - name: Install ordinary test Wasm prerequisites
        shell: bash
        run: |
          rustup target add --toolchain "$CANIC_INTERNAL_TOOLCHAIN" wasm32-unknown-unknown
          make install-ic-tools
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Check ordinary test helper tools
        shell: bash
        run: |
          cargo set-version --version
          rg --version
          rg --pcre2-version
          rustup target list --toolchain "$CANIC_INTERNAL_TOOLCHAIN" --installed | rg -x wasm32-unknown-unknown
          ic-wasm --version
      - name: Check runner disk before ordinary tests
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "ordinary tests before run" --min-free-mib 4096 --summary-only
      - name: Run workspace ordinary tests
        run: make test-ordinary
      - name: Report runner disk after ordinary-test failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "ordinary-test failure"
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  tests-pocketic:
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-
      - name: Install compiler cache
        shell: bash
        run: |
          bash scripts/ci/install-pinned-ci-tool.sh sccache
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/canic-sccache"
            echo "SCCACHE_CACHE_SIZE=2G"
            echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/scripts/ci/run-sccache.sh"
          } >> "$GITHUB_ENV"
      - name: Install PocketIC test helper tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          make install-rust-tools
          echo "$GITHUB_WORKSPACE/.tools/rust/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/rust/bin:$PATH"
      - name: Install wasm target
        shell: bash
        run: |
          echo "RUSTUP_TOOLCHAIN=$CANIC_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup target add --toolchain "$CANIC_INTERNAL_TOOLCHAIN" wasm32-unknown-unknown
          make install-ic-tools
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Check PocketIC test helper tools
        run: |
          candid-extractor --version
          icp --version
          ic-wasm --version
          wasm-opt --version
          rg --version
      - name: Restore validated PocketIC test artifacts
        id: pocketic-test-artifacts
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/test-artifacts
          key: >-
            pocketic-test-artifacts-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            pocketic-test-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'Cargo.lock') }}-
      - name: Verify and select prepared PocketIC server
        shell: bash
        run: |
          make install-ic-tools --check
          BIN="$GITHUB_WORKSPACE/.tools/ic/bin/pocket-ic"
          echo "POCKET_IC_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Check runner disk before PocketIC tests
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "PocketIC tests before run" --min-free-mib 4096 --summary-only
      - name: Run serial PocketIC tests
        run: make test-pocketic
      - name: Save validated PocketIC test artifacts
        if: ${{ !cancelled() && steps.pocketic-test-artifacts.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/test-artifacts
          key: >-
            pocketic-test-artifacts-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'Cargo.lock') }}-${{ github.sha }}
      - name: Report runner disk after PocketIC-test failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "PocketIC-test failure"
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  release-build:
    needs: [checks]
    if: >-
      ${{ success() && github.event_name == 'push' && github.ref ==
      'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
      - name: Check runner disk before release build
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "release build before compile" --min-free-mib 4096 --summary-only
      - name: Build release workspace
        run: bash scripts/ci/run-workspace-cargo.sh build --release --keep-going
      - name: Report runner disk after release-build failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "release-build failure"
