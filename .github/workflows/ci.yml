name: CI

env:
  CANIC_MSRV: 1.91.0
  CANIC_INTERNAL_TOOLCHAIN: 1.99.1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-targets: false
      - name: Install preflight tools
        shell: bash
        run: |
          make prepare-validation SCOPE=preflight
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
      - name: Check preflight tools
        shell: bash
        run: |
          rg --version
          rg --pcre2-version
          "$HOME/.local/bin/actionlint" -version
          "$HOME/.local/bin/shellcheck" --version
      - name: Run preflight validation with complete feedback
        shell: bash
        run: make ci-preflight
      - name: Retain failure logs and timings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/validation-runs/
            target/validation-failures/
            target/test-runs/
            target/dependency-audits/
          retention-days: 14
          if-no-files-found: ignore

  macos-host:
    needs: [preflight, security]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-targets: false
      - name: Record and verify native host
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          sw_vers
          uname -m
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
      - name: Install supported maintainer shell tools
        shell: bash
        run: |
          brew install bash coreutils gnu-sed
          {
            echo "$(brew --prefix bash)/bin"
            echo "$(brew --prefix coreutils)/libexec/gnubin"
            echo "$(brew --prefix gnu-sed)/libexec/gnubin"
          } >> "$GITHUB_PATH"
      - name: Install and qualify pinned native build tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          make prepare-build-environment
          make install-rust-tools install-candid-extractor
          echo "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/rust/common/bin:$PATH"
          extractor="$(make --no-print-directory candid-extractor-check)"
          echo "${extractor%/*}" >> "$GITHUB_PATH"
          export PATH="${extractor%/*}:$PATH"
          make install-ic-tools install-testkit-server
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
          make testkit-server-check
      - name: Qualify test worker failure and cancellation cleanup
        shell: bash
        run: |
          bash scripts/ci/test-pocketic-workers.sh
          bash scripts/ci/test-workspace-test-runner.sh
      - name: Qualify isolated formatting and safe hook setup
        shell: bash
        run: bash scripts/ci/test-git-hooks.sh
      - name: Compile Host and CLI
        run: cargo check --locked -p canic-host -p canic-cli --all-targets
      - name: Qualify Rust tool installation and executable selection
        shell: bash
        run: |
          cargo test --locked -p canic-host --lib tool_install::
          cargo test --locked -p canic-host --lib tool_resolution::
          cargo test --locked -p canic-host --lib binaryen::
          cargo test --locked -p canic-host --lib ic_wasm::
          cargo run --locked -p canic-cli --bin canic -- toolchain install
      - name: Qualify bounded ICP configuration reads
        run: |
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p canic-host --lib icp_config::tests::
      - name: Qualify native durability and backup recovery
        shell: bash
        run: |
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p canic-host --lib fleet_ensure::ops::attempt_recovery::tests::
          cargo test --locked -p canic-cli --lib output::tests::
          cargo test --locked -p canic-cli --lib fleet::tests::generated_desired_output_
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p canic-host --lib backup::checkpoint::
      - name: Check canister target from macOS
        run: cargo check --locked -p canic-control-plane --target wasm32-unknown-unknown --features root-control-plane
      - name: Build and finalize a representative canister artifact
        run: cargo run --locked -p canic-cli --bin canic -- build demo user_shard --environment local
      - name: Qualify one managed lifecycle through the Make PocketIC runner
        run: make test-pocketic-case CASE=pic::lifecycle::tests::published_managed_component_group_support_drives_child_lifecycle
      - name: Retain failure logs and timings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/validation-runs/
            target/validation-failures/
            target/test-runs/
            target/dependency-audits/
          retention-days: 14
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-targets: false
      - name: Install security tools
        shell: bash
        run: |
          make prepare-validation SCOPE=security
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
      - name: Check security tools
        shell: bash
        run: |
          cargo audit --version
          rg --version
      - name: Run security validation with complete feedback
        shell: bash
        run: make ci-security
      - name: Retain failure logs and timings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/validation-runs/
            target/validation-failures/
            target/test-runs/
            target/dependency-audits/
          retention-days: 14
          if-no-files-found: ignore

  msrv:
    needs: [preflight, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.CANIC_MSRV }}
      - name: Select MSRV toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$CANIC_MSRV" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-targets: false
      - name: Check runner disk before MSRV
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "MSRV before check" --min-free-mib 3072 --path "$GITHUB_WORKSPACE"
      - name: Check workspace MSRV
        run: bash scripts/ci/run-workspace-cargo.sh check --keep-going
      - name: Report runner disk after MSRV failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "MSRV failure" --path "$GITHUB_WORKSPACE" --min-free-mib 0 --diagnostic-path "$GITHUB_WORKSPACE/target" --diagnostic-path "$HOME/.cargo"
      - name: Retain failure logs and timings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/validation-runs/
            target/validation-failures/
            target/test-runs/
            target/dependency-audits/
          retention-days: 14
          if-no-files-found: ignore

  checks:
    needs: [preflight, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-targets: false
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-
      - name: Configure compiler cache
        shell: bash
        run: |
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/canic-sccache"
            echo "SCCACHE_CACHE_SIZE=2G"
          } >> "$GITHUB_ENV"
      - name: Install formatting tools
        shell: bash
        run: |
          make prepare-validation SCOPE=checks
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
      - name: Check formatting tools
        shell: bash
        run: |
          cargo sort --version
          cargo sort-derives --version
      - name: Qualify isolated formatting and safe hook setup
        shell: bash
        run: bash scripts/ci/test-git-hooks.sh
      - name: Check runner disk before Rust checks
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "checks before Rust validation" --min-free-mib 4096 --path "$GITHUB_WORKSPACE"
      - name: Run Rust checks with complete feedback
        shell: bash
        run: make ci-checks
      - name: Report runner disk after checks failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "checks failure" --path "$GITHUB_WORKSPACE" --min-free-mib 0 --diagnostic-path "$GITHUB_WORKSPACE/target" --diagnostic-path "$HOME/.cargo"
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Retain failure logs and timings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/validation-runs/
            target/validation-failures/
            target/test-runs/
            target/dependency-audits/
          retention-days: 14
          if-no-files-found: ignore

  tests-ordinary:
    needs: [checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-targets: false
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-
      - name: Install compiler cache
        shell: bash
        run: |
          make prepare-build-environment
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/canic-sccache"
            echo "SCCACHE_CACHE_SIZE=2G"
          } >> "$GITHUB_ENV"
      - name: Install ordinary test helper tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          make install-rust-tools
          {
            echo "$GITHUB_WORKSPACE/.tools/host/bin"
            echo "$GITHUB_WORKSPACE/.tools/rust/common/bin"
          } >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$GITHUB_WORKSPACE/.tools/rust/common/bin:$PATH"
          cargo install cargo-edit --version "$CANIC_CARGO_EDIT_VERSION" --locked
          make install-release-metadata-editor
      - name: Install ordinary test Wasm prerequisites
        shell: bash
        run: |
          rustup target add --toolchain "$CANIC_INTERNAL_TOOLCHAIN" wasm32-unknown-unknown
          make install-ic-tools
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Check ordinary test helper tools
        shell: bash
        run: |
          make rust-tools-check release-metadata-editor-check
          cargo sort --version
          cargo set-version --version
          rg --version
          rg --pcre2-version
          rustup target list --toolchain "$CANIC_INTERNAL_TOOLCHAIN" --installed | rg -x wasm32-unknown-unknown
          ic-wasm --version
      - name: Check runner disk before ordinary tests
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "ordinary tests before run" --min-free-mib 4096 --path "$GITHUB_WORKSPACE"
      - name: Run workspace ordinary tests
        run: make test-ordinary
      - name: Report runner disk after ordinary-test failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "ordinary-test failure" --path "$GITHUB_WORKSPACE" --min-free-mib 0 --diagnostic-path "$GITHUB_WORKSPACE/target" --diagnostic-path "$HOME/.cargo"
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Retain failure logs and timings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/validation-runs/
            target/validation-failures/
            target/test-runs/
            target/dependency-audits/
          retention-days: 14
          if-no-files-found: ignore

  tests-pocketic:
    needs: [checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-targets: false
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-${{ github.sha }}
          restore-keys: |
            compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.CANIC_INTERNAL_TOOLCHAIN }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'ci/tool-versions.env') }}-
      - name: Install compiler cache
        shell: bash
        run: |
          make prepare-build-environment
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/canic-sccache"
            echo "SCCACHE_CACHE_SIZE=2G"
          } >> "$GITHUB_ENV"
      - name: Install PocketIC test helper tools
        shell: bash
        run: |
          source tool-versions.env
          make install-host-tools
          echo "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/host/bin:$PATH"
          make install-rust-tools install-candid-extractor
          echo "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.tools/rust/common/bin:$PATH"
          extractor="$(make --no-print-directory candid-extractor-check)"
          echo "${extractor%/*}" >> "$GITHUB_PATH"
          export PATH="${extractor%/*}:$PATH"
      - name: Install wasm target
        shell: bash
        run: |
          echo "RUSTUP_TOOLCHAIN=$CANIC_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup target add --toolchain "$CANIC_INTERNAL_TOOLCHAIN" wasm32-unknown-unknown
          make install-ic-tools install-testkit-server
          echo "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Check PocketIC test helper tools
        run: |
          candid-extractor --version
          icp --version
          ic-wasm --version
          wasm-opt --version
          rg --version
      - name: Restore validated PocketIC test artifacts
        id: pocketic-test-artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/test-artifacts
          key: >-
            pocketic-test-artifacts-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            pocketic-test-artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'Cargo.lock') }}-
      - name: Verify and select prepared PocketIC server
        shell: bash
        run: |
          make ic-tools-check testkit-server-check
      - name: Check runner disk before PocketIC tests
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "PocketIC tests before run" --min-free-mib 4096 --path "$GITHUB_WORKSPACE"
      - name: Run serial PocketIC tests
        run: make test-pocketic
      - name: Save validated PocketIC test artifacts
        if: ${{ !cancelled() && steps.pocketic-test-artifacts.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/test-artifacts
          key: >-
            pocketic-test-artifacts-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('tool-versions.env', 'ci/ic-tools.tsv', 'Cargo.lock') }}-${{ github.sha }}
      - name: Report runner disk after PocketIC-test failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "PocketIC-test failure" --path "$GITHUB_WORKSPACE" --min-free-mib 0 --diagnostic-path "$GITHUB_WORKSPACE/target" --diagnostic-path "$HOME/.cargo"
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-primary-key != '' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/canic-sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Retain failure logs and timings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/validation-runs/
            target/validation-failures/
            target/test-runs/
            target/dependency-audits/
          retention-days: 14
          if-no-files-found: ignore

  release-build:
    needs: [checks]
    if: >-
      ${{ success() && github.event_name == 'push' && github.ref ==
      'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.CANIC_INTERNAL_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          cache-targets: false
      - name: Check runner disk before release build
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "release build before compile" --min-free-mib 4096 --path "$GITHUB_WORKSPACE"
      - name: Build release workspace
        run: bash scripts/ci/run-workspace-cargo.sh build --release --keep-going
      - name: Report runner disk after release-build failure
        if: ${{ failure() }}
        shell: bash
        run: bash scripts/ci/check-runner-disk-space.sh --label "release-build failure" --path "$GITHUB_WORKSPACE" --min-free-mib 0 --diagnostic-path "$GITHUB_WORKSPACE/target" --diagnostic-path "$HOME/.cargo"

      - name: Retain failure logs and timings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          path: |
            target/validation-runs/
            target/validation-failures/
            target/test-runs/
            target/dependency-audits/
          retention-days: 14
          if-no-files-found: ignore
