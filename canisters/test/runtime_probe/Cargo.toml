[package]
name = "runtime_probe"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = []

[package.metadata.canic]
app = "runtime_probe"
role = "test"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wire-schema = ["canic/wire-schema"]

[dependencies]
canic = { workspace = true, features = ["auth-delegated-token-verify", "auth-root-canister-sig-verify"] }
canic-icydb.workspace = true
ic-memory.workspace = true
ic-platform = { workspace = true, features = ["cdk", "candid", "management-canister-types"] }
ic-timers = { workspace = true }
ic-wire.workspace = true
serde.workspace = true

[build-dependencies]
canic = { workspace = true, features = [] }

[[example]]
name = "wire_schema"
required-features = ["wire-schema"]

[lints]
workspace = true
