[package]
name = "delegation_issuer_stub"
edition = { workspace = true }
rust-version.workspace = true
version = "0.115.0"
publish = false

[package.metadata.cargo-machete]
# `candid::Deserialize` expands against the destination crate's direct `serde`
# dependency.
ignored = ["serde"]

[package.metadata.canic]
app = "delegation_root_stub"
role = "issuer"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wire-schema = ["canic/wire-schema"]

[dependencies]
canic = { workspace = true, features = ["auth-issuer-canister-sig-create", "auth-local-application-authorization", "auth-portable-issuer", "auth-root-canister-sig-verify"] }
ic-platform = { workspace = true, features = ["cdk", "candid", "ed25519"] }
ic-wire.workspace = true
serde = { workspace = true }

[build-dependencies]
canic = { workspace = true, features = ["build-support"] }

[[example]]
name = "wire_schema"
required-features = ["wire-schema"]

[lints]
workspace = true
