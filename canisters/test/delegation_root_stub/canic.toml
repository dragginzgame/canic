controllers = []
[app]
name = "delegation_root_stub"

[roles.root]
kind = "root"
package = "."

[roles.issuer]
kind = "canister"
package = "../delegation_issuer_stub"

[roles.project_hub]
kind = "canister"
package = "../project_hub_stub"

[roles.project_instance]
kind = "canister"
package = "../project_instance_stub"

[auth.delegated_tokens]
enabled = true
build_network = "local"

[auth.delegated_tokens.chain_key_root_proof]
key_id = "key_1"
derivation_path_hash_hex = "fe51a87b988d221227b134c48f36787e891a902dcb5d48ea5f94cff8bfed5a16"
derivation_path_hex = ["63616e6963", "64656c65676174696f6e"]
public_key_hex = "02f1a0a900c4b9d53ff5ec024c0e37e7a54174c6ae1d0a77312aebea349adc0b7a"
key_version = 1
min_accepted_key_version = 1
min_accepted_proof_epoch = 2
min_accepted_registry_epoch = 2
valid_from_ns = 0
accept_until_ns = 4102444800000000000
max_revocation_latency_ns = 60000000000

[component_specs.issuer]
component_role = "issuer"
maximum_instances = 1
initial_cycles = "1T"

[component_specs.issuer.auth]
delegated_token_issuer = true
delegated_token_verifier = true
role_attestation_cache = true

[component_specs.issuer.provisions.projects]
maximum_instances_per_requester_per_root = 1

[component_specs.projects]
component_role = "project_hub"
maximum_instances = 2
initial_cycles = "1T"

[component_specs.projects.index.pools.projects]
canister_role = "project_instance"
key_name = "project"

[component_specs.projects.auth]
delegated_token_verifier = true
role_attestation_cache = true

[component_specs.projects.children.project_instance]
kind = "instance"
initial_cycles = "1T"

[component_specs.projects.children.project_instance.auth]
delegated_token_verifier = true
role_attestation_cache = true

[component_specs.projects.spawn_grants.project_hub.project_instance]
maximum_instances_per_parent = 20_000

[component_groups.grouped_projects.components.project_hub]
component_spec = "projects"

[component_group_deployments.grouped_projects]
component_group = "grouped_projects"
initial_placements = 1
maximum_placements = 1
placement.maximum_per_root = 1
placement.minimum_distinct_roots = 1
