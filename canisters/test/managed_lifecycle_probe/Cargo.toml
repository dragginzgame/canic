[package]
name = "managed_lifecycle_probe"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.114.0"
publish = false

[package.metadata.canic]
app = "managed_lifecycle_probe"
role = "test"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
icrc = ["canic/icrc"]
icrc-consent = ["icrc-discovery"]
icrc-discovery = ["icrc"]
wire-schema = ["canic/wire-schema"]

[dependencies]
canic = { workspace = true, features = ["internal-test-fixtures"] }
ic-platform = { workspace = true, features = ["cdk", "candid"] }
ic-storage = { workspace = true }
ic-timers.workspace = true
ic-wire = { workspace = true }
serde = { workspace = true }

[build-dependencies]
canic = { workspace = true, features = ["build-support"] }

[[example]]
name = "wire_schema"
required-features = ["wire-schema"]

[lints]
workspace = true
