[app]
name = "managed_lifecycle_probe"
init_mode = "enabled"

[roles.root]
kind = "root"

[roles.test]
kind = "canister"
package = "../managed_lifecycle_probe"
fleet_admission = true

[auth.delegated_tokens]
enabled = false

[component_specs.test]
component_role = "test"
maximum_instances = 2

[component_groups.unit.components.test]
component_spec = "test"

[component_group_deployments.unit]
component_group = "unit"
initial_placements = 1
maximum_placements = 2
placement.maximum_per_root = 2
placement.minimum_distinct_roots = 1
