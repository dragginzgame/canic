[app]
name = "scaling_probe"

[roles.root]
kind = "root"
package = "../root_probe"

[roles.scale_hub]
kind = "canister"
package = "."

[roles.scale_replica]
kind = "canister"
package = "../../../apps/test/scale"

[auth.delegated_tokens]
enabled = false

[component_specs.default]
component_role = "scale_hub"
maximum_instances = 1

[component_specs.default.scaling.pools.scales]
canister_role = "scale_replica"
policy.initial_workers = 0
policy.min_workers = 2

[component_specs.default.children.scale_replica]
kind = "replica"

[component_specs.default.spawn_grants.scale_hub.scale_replica]
maximum_instances_per_parent = 32
