controllers = []
[app]
name = "scaling_probe"

[roles.root]
kind = "root"
package = "../root_probe"

[roles.scale_hub]
kind = "canister"
package = "."

[roles.scale_replica]
kind = "canister"
package = "../../../apps/test/scale"

[auth.delegated_tokens]
enabled = false

[tree_specs.default]

[tree_groups.default]
tree_spec = "default"
initial_trees = 1
maximum_trees = 1

[tree_specs.default.canisters.root]
kind = "root"

[tree_specs.default.canisters.scale_hub]
kind = "service"

[tree_specs.default.canisters.scale_hub.scaling.pools.scales]
canister_role = "scale_replica"
policy.initial_workers = 0
policy.min_workers = 2

[tree_specs.default.canisters.scale_replica]
kind = "replica"
