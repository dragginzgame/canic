# Two Workloads and one separately configured Ready asset retain reset and funding recovery.
[app]
name = "standalone"

[roles.root]
kind = "root"

[roles.app]
kind = "canister"
package = "../leaf_probe"

[auth.delegated_tokens]
enabled = false

[component_specs.default]
component_role = "app"
maximum_instances = 2
initial_cycles = "1.9T"

[component_groups.qualification.components.member_00]
component_spec = "default"

[component_groups.qualification.components.member_01]
component_spec = "default"

[component_group_deployments.qualification]
component_group = "qualification"
initial_placements = 1
maximum_placements = 1
placement.maximum_per_root = 1
placement.minimum_distinct_roots = 1
