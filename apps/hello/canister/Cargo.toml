[package]
name = "canic-hello"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "First deployable Canic greeting application"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
greeting-v2 = []

[target.'cfg(target_family = "wasm")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["cdk"] }

[dependencies]
canic.workspace = true
ic-wire.workspace = true

[lints]
workspace = true
