# Skynet is an eight-Subnet Authority/Replica Fleet visualization demo.

[app]
name = "skynet"

# Add operator principals before building a deployable release.
[app.whitelist]
principals = []

[roles.root]
kind = "root"
package = "root"

[roles.skynet_node]
kind = "canister"
package = "node"

[roles.t800]
kind = "canister"
package = "t800"

[roles.memory_cell]
kind = "canister"
package = "memory_cell"

[auth.delegated_tokens]
enabled = false

[standards]
icrc21 = true

[component_specs.skynet]
component_role = "skynet_node"
maximum_instances = 32
initial_cycles = "2T"
topup.threshold = "2T"
topup.amount = "1T"

[component_specs.skynet.diagnostics]
memory_ledger = true

[component_specs.skynet.metrics]
profile = "full"

[component_specs.skynet.limits]
maximum_descendants = 12
maximum_registry_bytes = 16777216

[component_specs.skynet.limits.cycles_funding]
window_secs = 3600
maximum_cycles = "20T"

[component_specs.skynet.scaling.pools.t800_units]
canister_role = "t800"
policy.initial_workers = 1
policy.min_workers = 1
policy.max_workers = 4

[component_specs.skynet.sharding.pools.memory_cells]
canister_role = "memory_cell"
policy.capacity = 100
policy.initial_shards = 1
policy.max_shards = 4

[component_specs.skynet.children.t800]
kind = "replica"
initial_cycles = "500B"
topup.threshold = "1T"
topup.amount = "500B"

[component_specs.skynet.children.t800.diagnostics]
memory_ledger = true

[component_specs.skynet.children.t800.metrics]
profile = "full"

[component_specs.skynet.children.memory_cell]
kind = "shard"
initial_cycles = "500B"
topup.threshold = "1T"
topup.amount = "500B"

[component_specs.skynet.children.memory_cell.diagnostics]
memory_ledger = true

[component_specs.skynet.children.memory_cell.metrics]
profile = "full"

[component_specs.skynet.spawn_grants.skynet_node.t800]
maximum_instances_per_parent = 4

[component_specs.skynet.spawn_grants.skynet_node.memory_cell]
maximum_instances_per_parent = 4

[component_groups.skynet_cell.components.node]
component_spec = "skynet"
service = "skynet"
labels = { system = "skynet", interface = "console" }

[component_group_deployments.skynet_authority]
component_group = "skynet_cell"
service_purpose = "authority"
initial_placements = 1
maximum_placements = 1
placement.maximum_per_root = 1
placement.minimum_distinct_roots = 1
labels = { command = "primary", model = "neural_net_processor" }

[component_group_deployments.skynet_replicas]
component_group = "skynet_cell"
service_purpose = "replica"
initial_placements = 7
maximum_placements = 31
placement.maximum_per_root = 1
placement.minimum_distinct_roots = 7
labels = { command = "replica", model = "infiltration_grid" }

[services.fleet.targets.skynet]
role = "skynet_node"
component_spec = "skynet"
mode = "authority_replica"
authority_deployment = "skynet_authority"
authority_member = ["node"]
placement.maximum_members_per_root = 1
placement.minimum_distinct_roots = 8
