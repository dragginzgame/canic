[package]
name = "example-template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.canic.layout]
endpoints = "src/lib.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
inspection = ["canic/inspection"]

[dependencies]
canic = { workspace = true, features = ["method", "readiness"] }
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[[example]]
name = "example-template-wire"
path = "examples/wire.rs"
required-features = ["inspection"]

[lints]
workspace = true
