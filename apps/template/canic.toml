wasm = "artifacts/store.wasm"
build = { manifest = "../../Cargo.toml", package = "ic-wasm-store" }

[apps.template.canisters.app]
role = "app"
parent = "root"
wasm = "artifacts/app.wasm"
build = { manifest = "../../Cargo.toml", package = "template" }
