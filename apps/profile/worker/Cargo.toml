[package]
name = "canic-profile-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Standalone persistent profile demo with application-owned lifecycle"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic-profile-protocol.workspace = true
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
profile-v2 = []
reject-upgrade = []

[dev-dependencies]
canic-profile-protocol.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true

[lints]
workspace = true
