[package]
name = "canic-profile-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "One-slot autonomous profile worker manager"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic-profile-protocol.workspace = true
ic-platform = { workspace = true, features = ["management-canister-types"] }
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-storage.workspace = true
ic-timers.workspace = true
ic-wire.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
fault-injection = []
maintenance-candidate = []

[lints]
workspace = true
