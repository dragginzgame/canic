[package]
name = "canic-profile-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "One-slot autonomous profile worker manager"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic-management.workspace = true
canic-management-protocol.workspace = true
canic-profile-protocol.workspace = true
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-wire.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
fault-injection = ["canic-management/fault-injection"]
maintenance-candidate = ["canic-management/maintenance-candidate"]

[lints]
workspace = true
