[package]
name = "canic-profile-entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Persistent discovery entry for the Canic profile worker"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic-profile-protocol.workspace = true
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-storage.workspace = true
ic-wire.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
