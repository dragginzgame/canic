[package]
name = "canic-hello"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "First deployable Canic greeting application"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
greeting-v2 = []

[dependencies]
canic = { workspace = true, features = ["greeting", "metrics", "readiness"] }

[target.'cfg(target_family = "wasm")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }

[lints]
workspace = true
