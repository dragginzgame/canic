# Minimal Canic demo fleet for quick root-plus-app and sharding experiments.

controllers = []
[app]
name = "demo"

[roles.root]
kind = "root"
package = "root"

[roles.app]
kind = "canister"
package = "app"

[roles.user_hub]
kind = "canister"
package = "user_hub"

[roles.user_shard]
kind = "canister"
package = "user_shard"

[auth.delegated_tokens]
enabled = false

[tree_groups.default]
tree_spec = "default"
initial_trees = 1
maximum_trees = 1

[tree_specs.default.canisters.root]
kind = "root"

[tree_specs.default.canisters.app]
kind = "service"

[tree_specs.default.canisters.user_hub]
kind = "service"
topup = {}

[tree_specs.default.canisters.user_hub.sharding.pools.user_shards]
canister_role = "user_shard"
policy.capacity = 100
policy.initial_shards = 1
policy.max_shards = 4

[tree_specs.default.canisters.user_shard]
kind = "shard"
topup = {}
