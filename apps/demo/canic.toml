# Minimal Canic demo fleet for quick root-plus-app and sharding experiments.

controllers = []
[app]
name = "demo"

[roles.root]
kind = "root"
package = "root"

[roles.app]
kind = "canister"
package = "app"

[roles.user_hub]
kind = "canister"
package = "user_hub"

[roles.user_shard]
kind = "canister"
package = "user_shard"

[auth.delegated_tokens]
enabled = false

[component_specs.app]
component_role = "app"
maximum_instances = 1

[component_specs.users]
component_role = "user_hub"
maximum_instances = 1
topup = {}

[component_specs.users.sharding.pools.user_shards]
canister_role = "user_shard"
policy.capacity = 100
policy.initial_shards = 1
policy.max_shards = 4

[component_specs.users.children.user_shard]
kind = "shard"
maximum_instances = 4
topup = {}
