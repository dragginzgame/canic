[package]
name = "example-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "Endpoint traffic measured with IC Metrics"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
serde_json.workspace = true

[package.metadata.toko-tooling.loc]
category = "examples"

[lib]
crate-type = ["cdylib", "rlib"]

# Native codec launched by the Canic CLI for named fleet calls.
[[bin]]
name = "example-metrics-client"
path = "client/main.rs"

[dependencies]
canic = { workspace = true, features = ["method", "readiness"] }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
