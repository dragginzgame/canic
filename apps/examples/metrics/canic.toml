[apps.ex-metrics.canisters.root]
role = "root"
wasm = "artifacts/root.wasm"
build = { manifest = "../../../Cargo.toml", package = "canic-root", features = ["child-metrics"], client = "canic-root-client" }

[apps.ex-metrics.canisters.store]
role = "wasm-store"
parent = "root"
wasm = "artifacts/store.wasm"
build = { manifest = "../../../Cargo.toml", package = "ic-wasm-store" }

[apps.ex-metrics.canisters.ex-metrics]
role = "app"
parent = "root"
wasm = "artifacts/app.wasm"
build = { manifest = "../../../Cargo.toml", package = "ex-metrics", features = ["canic/endpoint-metrics"], client = "ex-metrics-client" }
