[package]
name = "ex-notebook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "A persistent scratch note for the local Backup example"

[package.metadata.toko-tooling.loc]
category = "examples"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
canic = { workspace = true, features = ["lifecycle", "method", "recovery", "storage"] }
ic-platform-runtime = { workspace = true, features = ["system-raw"] }
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
