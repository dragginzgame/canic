[package]
name = "example-user-directory-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[package.metadata.toko-tooling.loc]
category = "examples"

# IC DB identifies registered entities by their Rust module path.
[lib]
name = "user_directory_schema"

[features]
role-service = []
inspection = ["dep:ic-wire", "ic-wire/derive"]

[dependencies]
canic = { workspace = true, features = ["sharding"] }
ic-db.workspace = true
ic-wire = { workspace = true, optional = true }
serde.workspace = true

[build-dependencies]
ic-db = { workspace = true, features = ["build"] }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
