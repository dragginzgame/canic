[package]
name = "ex-user-directory-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[package.metadata.toko-tooling.loc]
category = "examples"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
inspection = ["canic/inspection", "ex-user-directory-schema/inspection"]
role-service = ["canic/role-attestation", "ex-user-directory-schema/role-service"]

[dependencies]
canic = { workspace = true, features = ["provisioning"] }
ex-user-directory-schema.workspace = true
ic-db.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[[example]]
name = "ex-user-directory-hub-wire"
path = "examples/wire.rs"
required-features = ["inspection"]

[lints]
workspace = true
