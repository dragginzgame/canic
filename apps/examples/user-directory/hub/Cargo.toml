[package]
name = "example-user-directory-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[package.metadata.toko-tooling.loc]
category = "examples"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "example-user-directory-hub-client"
path = "client/main.rs"
required-features = ["operator-client"]

[features]
operator-client = ["dep:clap", "dep:serde_json", "dep:ic-platform-types"]
inspection = ["canic/inspection", "example-user-directory-schema/inspection"]
role-service = [
    "dep:ic-platform-runtime",
    "canic/role-attestation",
    "example-user-directory-schema/role-service",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { workspace = true, optional = true }
ic-platform-types = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dependencies]
canic = { workspace = true, features = ["provisioning"] }
example-user-directory-schema.workspace = true
ic-db.workspace = true
ic-platform-runtime = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[[example]]
name = "example-user-directory-hub-wire"
path = "examples/wire.rs"
required-features = ["inspection"]

[lints]
workspace = true
