[apps.ex-user-directory]
wasm_store = true

[apps.ex-user-directory.canisters.ex-user-directory-hub]
role = "user_hub"
wasm = "artifacts/user_hub.wasm"
build = { manifest = "../../../Cargo.toml", package = "ex-user-directory-hub" }

[apps.ex-user-directory.canisters.ex-user-directory-shard]
role = "user_shard"
parent = "ex-user-directory-hub"
wasm = "artifacts/user_shard.wasm"
build = { manifest = "../../../Cargo.toml", package = "ex-user-directory-shard" }

[apps.ex-user-directory.fleets.local]
# Bind the simulator and installed principals before approving placement.
network = { kind = "Local" }

[[apps.ex-user-directory.fleets.local.shard_pools]]
component = "ex-user-directory-shard"
root = "root"
store = "store"
release = { name = "user_shard", version = "1" }
install_topology = true
install_args = "shard-nonce.bin"
keys_per_shard = 1
max_shards = 2
creation_budget = 2_000_000_000_000

[apps.ex-user-directory.fleets.local.receiver_policy]
# Choose on fresh install. Stable receivers require a Root refresh after upgrade.
storage = "volatile"
root = "root"
roles = ["user_hub", "user_shard"]
# Replace the local fixture issuer with the installed test issuer before planning.
issuer = "rrkah-fqaaa-aaaaa-aaaaq-cai"
role = "user"
network_id = "1111111111111111111111111111111111111111111111111111111111111111"
application_id = "2222222222222222222222222222222222222222222222222222222222222222"
limits = { default_session_secs = 60, max_session_secs = 1800, max_proof_ttl_ns = 60000000000 }
