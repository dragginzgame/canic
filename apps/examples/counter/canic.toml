[apps.ex-counter.canisters.root]
role = "root"
wasm = "artifacts/root.wasm"
build = { manifest = "../../../Cargo.toml", package = "canic-root" }

[apps.ex-counter.canisters.store]
role = "wasm-store"
parent = "root"
wasm = "artifacts/store.wasm"
build = { manifest = "../../../Cargo.toml", package = "ic-wasm-store" }

[apps.ex-counter.canisters.ex-counter]
role = "app"
parent = "root"
wasm = "artifacts/app.wasm"
build = { manifest = "../../../Cargo.toml", package = "ex-counter", client = "ex-counter-client" }

[apps.ex-counter.fleets.mainnet]
network = { kind = "Mainnet" }
canisters = {}
