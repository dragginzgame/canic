[package]
name = "example-counter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "Persistent counter application for the Canic demo fleet"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
serde_json.workspace = true

[package.metadata.toko-tooling.loc]
category = "examples"

[lib]
crate-type = ["cdylib", "rlib"]

# Native codec launched by the Canic CLI for named fleet calls.
[[bin]]
name = "example-counter-client"
path = "client/main.rs"

[features]
counter-v2 = []
incompatible-schema = []
initially-fenced = []
reject-upgrade = []

[dependencies]
canic = { workspace = true, features = ["lifecycle", "method", "readiness", "recovery", "storage"] }
ic-platform-runtime = { workspace = true, features = ["system-raw"] }
ic-platform-types.workspace = true
ic-storage.workspace = true

ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
