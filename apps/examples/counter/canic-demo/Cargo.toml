[package]
name = "canic-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
description = "Persistent counter application for the Canic demo fleet"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
serde_json.workspace = true

[package.metadata.toko-tooling.loc]
category = "examples"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "canic-demo-client"
path = "src/client/main.rs"

[features]
counter-v2 = []
incompatible-schema = []
initially-fenced = []
reject-upgrade = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic = { workspace = true, features = ["readiness", "recovery", "storage"] }
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-platform-types.workspace = true
ic-storage.workspace = true

[dependencies]
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
