[apps.miner-pool]

[apps.miner-pool.canisters.pool]
role = "pool"
parent = "root"
wasm = "artifacts/pool.wasm"
build = { manifest = "../../../Cargo.toml", package = "example-miner-pool-hub", client = "example-miner-pool-client" }

[apps.miner-pool.canisters.miner]
role = "miner"
parent = "pool"
wasm = "artifacts/miner.wasm"
build = { manifest = "../../../Cargo.toml", package = "example-miner-pool-miner" }

[apps.miner-pool.fleets.local]
network = { kind = "Local" }

subnet_child_limit = 5

[[apps.miner-pool.fleets.local.worker_pools]]
component = "miner"
root = "root"
store = "store"
release = { name = "miner", version = "1" }
max_workers = 4
creation_budget = 4_000_000_000_000
minimum_reuse_cycles = 500_000_000_000
