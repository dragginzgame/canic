# Saltz is inert until its observation, timer and external-effect gates close.

[app]
name = "saltz"

[roles.root]
kind = "root"
package = "root"

[roles.burner]
kind = "canister"
package = "burner"

[auth.delegated_tokens]
enabled = false

[component_specs.burner]
component_role = "burner"
maximum_instances = 1
