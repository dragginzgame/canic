[package]
name = "canister_user_shard"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false
build = "../build.rs"

[package.metadata.cargo-machete]
ignored = []

[package.metadata.canic]
app = "test"
role = "user_shard"

[lib]
crate-type = ["cdylib"]

[dependencies]
