[package]
name = "canister_user_shard"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.114.0"
publish = false
build = "../build.rs"

[package.metadata.cargo-machete]
ignored = []

[package.metadata.canic]
app = "test"
role = "user_shard"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wire-schema = ["canic/wire-schema"]

[dependencies]
canic = { workspace = true, features = ["internal-test-fixtures", "auth-delegated-token-verify", "auth-issuer-canister-sig-create", "auth-root-canister-sig-verify"] }
ic-platform = { workspace = true, features = ["cdk", "candid"] }
ic-storage = { workspace = true }
ic-wire = { workspace = true }
serde = { workspace = true }

[build-dependencies]
canic = { workspace = true, features = ["build-support"] }

[[example]]
name = "wire_schema"
required-features = ["wire-schema"]

[lints]
workspace = true
