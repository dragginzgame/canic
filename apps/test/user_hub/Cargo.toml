[package]
name = "canister_user_hub"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false
build = "../build.rs"

[package.metadata.cargo-machete]
ignored = ["ic-cdk"]

[package.metadata.canic]
app = "test"
role = "user_hub"

[lib]
crate-type = ["cdylib"]

[dependencies]
canic = { workspace = true, features = ["sharding"] }
ic-memory = { workspace = true }
ic-platform = { workspace = true, features = ["cdk", "candid"] }

[build-dependencies]
canic = { workspace = true, features = [] }

[lints]
workspace = true
