[package]
name = "canister_test"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.114.0"
publish = false

[package.metadata.cargo-machete]
# Canic/CDK macro expansion resolves `candid` in the destination crate.
ignored = []

[package.metadata.canic]
app = "test"
role = "test"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wire-schema = ["canic/wire-schema"]

[dependencies]
canic = { workspace = true, features = ["auth-delegated-token-verify", "auth-root-canister-sig-verify"] }
ic-platform = { workspace = true, features = ["cdk", "candid"] }
ic-timers = { workspace = true }
ic-wire = { workspace = true }

[build-dependencies]
canic = { workspace = true, features = ["build-support"] }

[[example]]
name = "wire_schema"
required-features = ["wire-schema"]

[lints]
workspace = true
