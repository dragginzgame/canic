[package]
name = "canister_test"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]
# Canic/CDK macro expansion resolves `candid` in the destination crate.
ignored = []

[package.metadata.canic]
app = "test"
role = "test"

[lib]
crate-type = ["cdylib"]

[dependencies]
canic = { workspace = true, features = ["auth-chain-key-ecdsa", "auth-root-canister-sig-verify"] }
ic-platform = { workspace = true, features = ["cdk", "candid"] }
ic-timers = { workspace = true }

[build-dependencies]
canic = { workspace = true, features = [] }

[lints]
workspace = true
