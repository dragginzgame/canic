[package]
name = "canister_test"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]
# Canic/CDK macro expansion resolves `candid` in the destination crate.
ignored = ["candid"]

[package.metadata.canic]
app = "test"
role = "test"

[lib]
crate-type = ["cdylib"]

[dependencies]
candid = { workspace = true }
canic = { workspace = true, features = ["auth-delegated-token-verify"] }
ic-cdk = { workspace = true }
ic-timers = { workspace = true }

[build-dependencies]
canic = { workspace = true, features = [] }

[lints]
workspace = true
