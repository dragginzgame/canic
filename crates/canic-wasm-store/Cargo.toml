[package]
name = "canic-wasm-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Persistent versioned Wasm custody separate from Root"

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic-wasm-store-protocol.workspace = true
ic-platform = { workspace = true, features = ["management-canister-types"] }
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true
sha2.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
maintenance-candidate = []

[dev-dependencies]
canic-wasm-store-protocol.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true
sha2.workspace = true

[lints]
workspace = true
