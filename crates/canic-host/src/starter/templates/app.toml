[package]
name = "starter-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[package.metadata.canic.layout]
endpoints = "src/lib.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
inspection = ["canic/inspection"]

[dependencies]
canic = { workspace = true, features = ["method", "readiness"] }
serde.workspace = true

# Locked artifact sources for managed builds.
[target.'cfg(any())'.dependencies]
canic-root.workspace = true
ic-wasm-store.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[[example]]
name = "starter-app-wire"
path = "examples/wire.rs"
required-features = ["inspection"]

[lints]
workspace = true
