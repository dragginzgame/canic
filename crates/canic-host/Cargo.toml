[package]
name = "canic-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Reviewed deployment plans and retained signed attempts for Canic"

# Artifact build input resolved through Cargo metadata; never linked into Host.
[target.'cfg(any())'.dependencies]
ic-wasm-store.workspace = true

[features]
ephemeral = ["dep:ic-testkit"]

[dependencies]
base64.workspace = true
canic = { workspace = true, features = ["auth"] }
canic-management-protocol = { workspace = true, features = ["standby-pool"] }
ic-host-artifacts.workspace = true
ic-host-fs.workspace = true
ic-host-process.workspace = true
ic-host-text.workspace = true
ic-platform = { workspace = true, features = ["ingress-packets", "native-signed-secp256k1"] }
ic-platform-protocol = { workspace = true, features = ["ledger"] }
ic-platform-types.workspace = true
ic-query-topology.workspace = true
ic-testkit = { workspace = true, optional = true, features = ["managed-server"] }
ic-wasm-store-protocol.workspace = true
ic-wire = { workspace = true, features = ["service-client"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
url.workspace = true
wasmparser.workspace = true

[dev-dependencies]
ic-platform = { workspace = true, features = ["ed25519"] }
toko-tooling.workspace = true

[lints]
workspace = true
