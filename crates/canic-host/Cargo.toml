[package]
name = "canic-host"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
license = { workspace = true }
description = "Host-side App build and desired-state Fleet reconciliation library for Canic workspaces"
readme = "README.md"
documentation = "https://docs.rs/canic-host"
homepage = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
publish = true

[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[features]
local-fleet = ["dep:ic-testkit", "dep:reqwest"]

[dependencies]
candid = { workspace = true }
candid_parser = { workspace = true }
# Host materializes metadata for every infrastructure role.
canic-control-plane = { workspace = true, features = [
    "fleet-coordinator-canister",
    "root-control-plane",
    "wasm-store-canister",
] }
canic-core = { workspace = true, features = ["auth-chain-key-ecdsa"] }
ciborium = { workspace = true }
crc32fast = { workspace = true }
flate2 = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
ic-agent = { workspace = true }
ic-certification = { workspace = true }
ic-query = { workspace = true }
ic-testkit = { workspace = true, optional = true }
icrc-ledger-types = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
toml = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
ic-testkit = { workspace = true }
ic-verify-bls-signature = { workspace = true }

[[example]]
name = "local_fleet"
required-features = ["local-fleet"]

[lints]
workspace = true
