[package]
name = "canic-control-plane"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
license = { workspace = true }
description = { workspace = true }
readme = "README.md"
documentation = "https://docs.rs/canic-control-plane"
homepage = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
publish = true

[features]
default = ["fleet-coordinator-canister", "root-control-plane", "wasm-store-canister"]
fleet-coordinator-canister = []
root-control-plane = ["dep:serde_json"]
wasm-store-canister = []

[dependencies]
async-trait = { workspace = true }
canic-contracts.workspace = true
canic-core = { workspace = true }
ic-call.workspace = true
ic-platform = { workspace = true, features = ["cdk", "candid", "management-canister-types", "cycles-ledger-types"] }
ic-timers = { workspace = true }
ic-wire = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
ic-memory = { workspace = true, features = ["test-support"] }
toml = { workspace = true }

[lints]
workspace = true
