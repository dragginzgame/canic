[package]
name = "canic-testing-internal"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
license = { workspace = true }
description = "Workspace-only internal test support for Canic self-tests"
readme = "README.md"
publish = false

[package.metadata.cargo-machete]
# `candid::Deserialize` expands against the destination crate's direct `serde`
# dependency.
ignored = ["serde"]

[features]
# Keep the large governed PocketIC case catalogue out of ordinary and fast
# library-test compilation. The workspace PocketIC lane enables it explicitly.
default = ["pocketic-fixtures"]
governed-pocketic-tests = ["pocketic-fixtures", "canic-host/local-fleet"]
pocketic-fixtures = []

[dependencies]
candid = { workspace = true }
canic = { workspace = true, features = ["testing"] }
canic-contracts.workspace = true
canic-control-plane = { workspace = true, features = [
    "root-control-plane",
    "wasm-store-canister",
] }
canic-core = { workspace = true }
canic-host = { workspace = true }
ciborium = { workspace = true }
flate2 = { workspace = true }
ic-host-fs = { workspace = true }
ic-testkit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
candid_parser = { workspace = true }
canic-cli = { workspace = true }
ic-query = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
tokio = { workspace = true }

[lints]
workspace = true
