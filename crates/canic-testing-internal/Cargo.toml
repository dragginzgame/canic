[package]
name = "canic-testing-internal"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
license = { workspace = true }
description = "Workspace-only internal test support for Canic self-tests"
readme = "README.md"
publish = false

[package.metadata.cargo-machete]
# `candid::Deserialize` expands against the destination crate's direct `serde`
# dependency.
ignored = ["serde"]

[dependencies]
candid = { workspace = true }
canic = { workspace = true, features = [] }
canic-control-plane = { workspace = true, features = [
    "root-control-plane",
    "wasm-store-canister",
] }
canic-core = { workspace = true }
canic-host = { workspace = true }
flate2 = { workspace = true }
ic-testkit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
pocket-ic = { workspace = true }

[lints]
workspace = true
