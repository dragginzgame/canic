[package]
name = "canic-testing-internal"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
license = { workspace = true }
description = "Workspace-only internal test support for Canic self-tests"
readme = "README.md"
publish = false

[package.metadata.cargo-machete]
# `candid::Deserialize` expands against the destination crate's direct `serde`
# dependency.
ignored = ["serde"]

[features]
# Keep the large governed PocketIC case catalogue out of ordinary and fast
# library-test compilation. The workspace PocketIC lane enables it explicitly.
governed-pocketic-tests = ["canic-host/local-fleet", "ic-testkit/held-reply-fixtures"]

[dependencies]
canic = { workspace = true, features = ["testing"] }
canic-contracts.workspace = true
canic-control-plane = { workspace = true, features = [
    "root-control-plane",
    "wasm-store-canister",
] }
canic-core = { workspace = true }
canic-host = { workspace = true }
ic-build.workspace = true
ic-host-artifacts = { workspace = true, features = ["gzip", "wasm"] }
ic-host-fs = { workspace = true }
ic-host-process.workspace = true
ic-platform = { workspace = true, features = ["pocket-ic", "candid", "candid-parser"] }
ic-testkit = { workspace = true, features = ["reply-fixtures", "wire"] }
ic-wire.workspace = true
serde = { workspace = true }
serde_cbor = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
canic-blob-service = { workspace = true }
canic-cli = { workspace = true }
ic-blob-storage-contracts = { workspace = true, features = ["wire-schema"] }
ic-query = { workspace = true }
proc-macro2 = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
tokio = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
canic-contracts = { workspace = true, features = ["wire-schema"] }
ic-wire = { workspace = true, features = ["typescript"] }

[lints]
workspace = true
