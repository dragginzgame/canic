[package]
name = "canic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Small Canic contracts and optional actor adapters"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
blob = ["dep:ic-blob-storage", "dep:ic-platform-runtime"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, optional = true, features = ["cdk"] }

[dependencies]
ic-blob-storage = { workspace = true, optional = true }
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
