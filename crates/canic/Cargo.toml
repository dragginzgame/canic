[package]
name = "canic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Small Canic contracts and optional actor adapters"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
auth = ["dep:ic-auth-protocol-types", "dep:ic-auth-wire", "dep:ic-platform-runtime"]
auth-browser = ["auth", "ic-auth-wire/typescript"]
auth-enrollment = [
    "auth",
    "ic-auth/receiver-memory",
    "ic-auth/ed25519-verification",
    "raw-rand",
    "lifecycle",
    "dep:sha2",
]
auth-receiver-stable = ["auth-enrollment", "ic-auth/receiver-stable", "storage"]
auth-issuer-stable = ["auth", "ic-auth/issuer-stable"]
blob = [
    "dep:ic-blob-storage",
    "dep:ic-platform-runtime",
    "dep:ic-platform-types",
    "dep:ic-storage",
]
db = ["dep:ic-platform-runtime"]
db-schema = ["db", "dep:ic-db"]
db-store = ["dep:ic-db", "dep:sha2", "storage"]
endpoint-metrics = ["metrics"]
entropy = ["dep:ic-entropy", "raw-rand"]
inspection = [
    "dep:inventory",
    "dep:serde_json",
    "ic-wire/derive",
    "ic-wire/platform-types",
    "ic-auth-wire?/typescript",
    "ic-db?/wire",
]
jobs = ["dep:ic-jobs", "timers"]
lifecycle = ["dep:ic-platform-runtime"]
logging = [
    "method",
    "lifecycle",
    "dep:ic-logging",
    "ic-blob-storage?/logging",
    "ic-db?/logging",
    "ic-entropy?/logging",
]
method = [
    "dep:canic-macros",
    "dep:ic-platform-runtime",
    "ic-platform-runtime/call-ic0",
    "dep:ic-platform-types",
]
metrics = [
    "dep:ic-metrics",
    "method",
    "lifecycle",
    "ic-blob-storage?/metrics",
    "ic-db?/metrics",
    "ic-entropy?/metrics",
    "ic-jobs?/metrics",
    "ic-timers?/metrics",
]
raw-rand = ["dep:ic-platform-runtime", "ic-platform-runtime/raw-rand"]
recovery = []
provisioning = ["sharding", "stateful-role", "method"]
readiness = ["dep:ic-platform-runtime"]
role-attestation = ["role-verification", "storage"]
role-verification = ["topology", "method", "dep:ic-platform"]
sharding = ["dep:ic-platform-runtime", "dep:ic-platform-types"]
receiver-role = ["method", "auth-receiver-stable", "readiness", "sharding", "topology"]
stateful-role = ["receiver-role", "db-store"]
storage = ["dep:ic-storage"]
timers = ["dep:ic-timers", "lifecycle"]
topology = ["dep:canic-macros", "dep:ic-platform-types", "dep:ic-platform-runtime"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
inventory = { workspace = true, optional = true }

[dependencies]
canic-macros = { workspace = true, optional = true }
ic-auth = { workspace = true, optional = true }
ic-auth-protocol-types = { workspace = true, optional = true }
ic-auth-wire = { workspace = true, optional = true }
ic-blob-storage = { workspace = true, optional = true }
ic-db = { workspace = true, optional = true }
ic-entropy = { workspace = true, optional = true }
ic-jobs = { workspace = true, optional = true, features = ["execution"] }
ic-logging = { workspace = true, optional = true }
ic-metrics = { workspace = true, optional = true }
ic-platform = { workspace = true, optional = true, features = ["ed25519"] }
ic-platform-runtime = { workspace = true, optional = true, features = ["entrypoint-macros", "system-raw"] }
ic-platform-types = { workspace = true, optional = true }
ic-storage = { workspace = true, optional = true }
ic-timers = { workspace = true, optional = true }
ic-wire.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
toko-tooling.workspace = true

[lints]
workspace = true

[[example]]
name = "auth-codecs"
required-features = ["auth-browser"]

[[test]]
name = "named_contract"
required-features = ["method"]

[[test]]
name = "durable_routes"
required-features = ["receiver-role"]
