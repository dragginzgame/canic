[package]
name = "canic-root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Root for bounded controller-approved application canisters"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
backup = ["canic-management/backup", "dep:serde"]
sharding = ["canic/sharding", "canic-management/sharding"]
blob = ["canic-management/blob"]
auth = ["canic/auth-enrollment"]
fault-injection = ["canic-management/fault-injection"]
maintenance-candidate = ["canic-management/maintenance-candidate"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic = { workspace = true, features = ["metrics"] }
canic-management.workspace = true
canic-management-protocol.workspace = true
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-wire.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
