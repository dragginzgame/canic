[package]
name = "canic-root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Root for one approved greeting application canister"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic.workspace = true
canic-management.workspace = true
canic-management-protocol.workspace = true
ic-platform-runtime = { workspace = true, features = ["cdk"] }
ic-wire.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
maintenance-candidate = ["canic-management/maintenance-candidate"]

[lints]
workspace = true
