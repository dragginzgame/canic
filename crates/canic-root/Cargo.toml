[package]
name = "canic-root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Root for bounded controller-approved application canisters"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "canic-root-client"
path = "client/main.rs"
required-features = ["operator-client"]

[features]
operator-client = ["dep:clap", "dep:serde_json"]
child-metrics = ["operator-client"]
role-issuer = [
    "operator-client",
    "canic-management/role-issuer",
    "canic-management-protocol/retirement",
]
reserve-pool = ["operator-client"]
backup = ["canic-management/backup"]
blob = ["canic-management/blob"]
auth = ["canic/auth-enrollment", "canic-management/auth"]
fault-injection = ["canic-management/fault-injection"]
maintenance-candidate = ["canic-management/maintenance-candidate"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dependencies]
canic = { workspace = true, features = ["logging", "metrics", "sharding"] }
canic-management = { workspace = true, features = ["sharding"] }
canic-management-protocol = { workspace = true, features = ["standby"] }
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-platform-types.workspace = true
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
