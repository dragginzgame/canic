[package]
name = "canic-root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Root for bounded controller-approved application canisters"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "canic-root-client"
path = "client/main.rs"
required-features = ["operator-client"]

[features]
operator-client = ["dep:clap", "dep:serde_json"]
child-metrics = ["operator-client"]
role-issuer = [
    "sharding",
    "canic-management/role-issuer",
    "canic-management-protocol/retirement",
]
shard-pool = ["sharding"]
worker-pool = ["sharding"]
registry = ["sharding"]
reserve-pool = ["sharding"]
child-funding = ["sharding"]
backup = ["canic-management/backup", "dep:serde"]
sharding = [
    "canic-management-protocol/standby",
    "canic/sharding",
    "canic-management/sharding",
    "operator-client",
    "dep:ic-platform-types",
    "dep:serde",
]
blob = ["canic-management/blob"]
auth = ["canic/auth-enrollment", "canic-management/auth"]
fault-injection = ["canic-management/fault-injection"]
maintenance-candidate = ["canic-management/maintenance-candidate"]

[dependencies]
canic = { workspace = true, features = ["logging", "metrics"] }
canic-management.workspace = true
canic-management-protocol.workspace = true
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-platform-types = { workspace = true, optional = true }
ic-wire.workspace = true
serde = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
