[package]
name = "canic-root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Root for bounded controller-approved application canisters"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
serde_json.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "canic-root-client"
path = "client/main.rs"

[features]
fault-injection = ["canic-management/fault-injection"]

[dependencies]
canic = { workspace = true, features = ["auth-enrollment", "sharding"] }
canic-management = { workspace = true, features = ["auth", "blob", "role-issuer"] }
canic-management-protocol = { workspace = true, features = ["standby-pool"] }
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-platform-types.workspace = true
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
