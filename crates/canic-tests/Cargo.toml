[dev-dependencies]
canic-control-plane = { workspace = true, features = [
    "root-control-plane",
    "wasm-store-canister",
] }
canic-core = { workspace = true }
canic-host = { workspace = true }
ciborium = { workspace = true }
ic-memory = { workspace = true, features = ["test-support"] }
ic-platform = { workspace = true, features = ["agent"] }
ic-stable-structures.workspace = true
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
