[package]
name = "canic-tests"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
license = { workspace = true }
description = "Workspace-only integration tests for Canic"
readme = false
publish = false

[dependencies]
canic = { workspace = true, features = [] }
canic-contracts.workspace = true
canic-testing-internal = { workspace = true }
ic-platform = { workspace = true, features = ["pocket-ic", "candid"] }
ic-testkit = { workspace = true, features = ["wire"] }
ic-timers = { workspace = true }
ic-wire.workspace = true
serde = { workspace = true }

[dev-dependencies]
canic-core = { workspace = true }
canic-host = { workspace = true }
ic-host-artifacts = { workspace = true, features = ["wasm"] }
ic-memory = { workspace = true, features = ["test-support"] }
ic-platform = { workspace = true, features = ["agent", "candid-parser", "stable-structures"] }
serde_json = { workspace = true }

[lints]
workspace = true
