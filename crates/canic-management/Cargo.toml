[package]
name = "canic-management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Reusable bounded child management engine"

[features]
auth = ["canic/auth"]
role-issuer = ["sharding", "canic/raw-rand", "dep:ic-platform"]
sharding = ["ic-platform-protocol/registry-placement", "canic/sharding", "dep:sha2"]
blob = ["canic/blob"]
fault-injection = []

[dependencies]
canic = { workspace = true, features = ["storage", "timers"] }
canic-management-protocol.workspace = true
ic-platform = { workspace = true, features = ["ed25519"], optional = true }
ic-platform-protocol = { workspace = true, features = ["management"] }
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-timers.workspace = true
ic-wasm-store-protocol.workspace = true
ic-wire.workspace = true
serde.workspace = true
sha2 = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
