[package]
name = "canic-management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Reusable bounded child management engine"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[features]
backup = ["canic-management-protocol/backup"]
blob = ["canic/blob"]
fault-injection = []
maintenance-candidate = []

[dependencies]
canic-management-protocol.workspace = true
ic-wasm-store-protocol.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic = { workspace = true, features = ["storage"] }
ic-platform-protocol = { workspace = true, features = ["management"] }
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-timers = { workspace = true, features = ["metrics"] }
ic-wire.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
canic = { workspace = true, features = ["storage"] }
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true

[lints]
workspace = true
