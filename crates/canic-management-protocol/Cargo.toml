[package]
name = "canic-management-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Bounded child management authority and evidence"

[features]
standby = ["dep:canic", "canic/method"]
retirement = ["dep:canic", "canic/method"]
backup = ["dep:canic", "dep:ic-platform-protocol"]

[dependencies]
canic = { workspace = true, features = ["recovery"], optional = true }
ic-platform-protocol = { workspace = true, features = ["management-snapshots"], optional = true }
ic-wasm-store-protocol.workspace = true
ic-wire.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sha2.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
