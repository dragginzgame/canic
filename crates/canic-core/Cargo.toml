[package]
name = "canic-core"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
license = { workspace = true }
description = { workspace = true }
readme = "README.md"
documentation = "https://docs.rs/canic-core"
homepage = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
publish = true

[package.metadata.cargo-machete]
ignored = ["serde_bytes"]

[features]
default = []
sharding = []
auth-chain-key-ecdsa = ["ic-auth/token-verification"]
auth-chain-key-root-sign = ["auth-chain-key-ecdsa", "auth-root-delegation-state"]
auth-delegated-token-issuer-state = []
auth-root-canister-sig-create = ["ic-auth/canister-signature-preparation", "dep:ic-certification"]
auth-root-canister-sig-verify = ["ic-auth/canister-signature-verification"]
auth-issuer-canister-sig-create = [
    "auth-delegated-token-issuer-state",
    "ic-auth/canister-signature-preparation",
    "dep:ic-certification",
]
auth-issuer-canister-sig-verify = ["ic-auth/canister-signature-verification"]
auth-delegated-token-verify = ["auth-chain-key-ecdsa", "auth-issuer-canister-sig-verify"]
auth-local-application-authorization = ["auth-delegated-token-verify", "ic-auth/sessions"]
auth-root-delegation-state = []
internal-test-fixtures = []

[dependencies]
async-trait = { workspace = true }
candid = { workspace = true }
canic-contracts.workspace = true
ciborium = { workspace = true }
ic-auth = { workspace = true }
ic-auth-protocol-types = { workspace = true }
ic-cdk = { workspace = true }
ic-certification = { workspace = true, optional = true }
ic-memory = { workspace = true }
ic-metrics.workspace = true
ic-timers = { workspace = true }
remain = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ic-secp256k1 = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde_path_to_error = { workspace = true }
toml = { workspace = true }

[build-dependencies]
candid = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true }
ic-auth = { workspace = true, features = ["sessions"] }
k256 = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }

[[bench]]
name = "serialize"
harness = false
test = false

[lints]
workspace = true
