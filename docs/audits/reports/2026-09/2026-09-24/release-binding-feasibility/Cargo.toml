[package]
name = "canic-release-binding-feasibility"
version = { workspace = true }
edition = { workspace = true }
publish = false

[[bin]]
name = "canic-release-binding-feasibility"
path = "harness.rs"

[dependencies]
candid = { workspace = true }
ic-testkit = { workspace = true }
pocket-ic = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
wasmparser = { workspace = true }

[profile.dev]
opt-level = 1
lto = false
codegen-units = 16
strip = "none"
debug = "line-tables-only"
overflow-checks = true

[workspace]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
candid = "=0.10.36"
ic-testkit = "=0.10.0"
pocket-ic = "=16.0.0"
serde_json = "1"
sha2 = "=0.10.9"
wasmparser = "=0.247.0"
