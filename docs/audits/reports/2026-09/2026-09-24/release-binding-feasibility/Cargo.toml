[package]
name = "canic-release-binding-feasibility"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "canic-release-binding-feasibility"
path = "harness.rs"

[dependencies]
candid = "=0.10.36"
ic-testkit = "=0.10.0"
pocket-ic = "=16.0.0"
serde_json = "1"
sha2 = "=0.10.9"
wasmparser = "=0.247.0"

[profile.dev]
opt-level = 1
lto = false
codegen-units = 16
strip = "none"
debug = "line-tables-only"
overflow-checks = true

[workspace]
