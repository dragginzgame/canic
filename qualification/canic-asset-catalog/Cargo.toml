[package]
name = "canic-asset-catalog"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Installed embedded Blob and application catalog composition witness"

# The asset-library app builder resolves Root from this workspace lock.
[target.'cfg(any())'.dependencies]
canic-root.workspace = true

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
fault-injection = []
maintenance-candidate = []
profile = ["dep:canic-profile-worker", "dep:canic-profile-protocol"]

[dependencies]
canic = { workspace = true, features = ["blob"] }
canic-profile-protocol = { workspace = true, optional = true }
canic-profile-worker = { workspace = true, optional = true }
ic-platform-runtime.workspace = true
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
canic = { workspace = true, features = ["inspection"] }
toko-tooling.workspace = true

[lints]
workspace = true
