[package]
name = "canic-profile-worker"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Retained persistent ownership and composition qualification fixture"

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["canister"]
canister = ["dep:canic", "dep:ic-platform-runtime"]
profile-v2 = []
reject-upgrade = []

[dependencies]
canic-profile-protocol.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic = { workspace = true, optional = true, features = ["method"] }
ic-platform-runtime = { workspace = true, optional = true, features = ["entrypoint-macros", "system-raw"] }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
