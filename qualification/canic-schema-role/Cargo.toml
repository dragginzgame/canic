[package]
name = "canic-schema-role"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Installed multi-store role qualification"

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
blob-receiver = ["receiver", "canic/blob"]
receiver = ["canic/stateful-role", "canic/role-attestation"]
inspection = ["canic/inspection"]

[dependencies]
canic = { workspace = true, features = ["db-store"] }
ic-db.workspace = true
ic-platform-runtime.workspace = true
ic-storage.workspace = true

[build-dependencies]
ic-db = { workspace = true, features = ["build"] }

[dev-dependencies]
toko-tooling.workspace = true

[[example]]
name = "canic-schema-role-wire"
path = "examples/wire.rs"
required-features = ["inspection"]

[lints]
workspace = true
