[package]
name = "canic-profile-manager"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Retained autonomous-management qualification fixture"

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
fault-injection = ["canic-management/fault-injection"]
maintenance-candidate = ["canic-management/maintenance-candidate"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic = { workspace = true, features = ["metrics"] }
canic-management.workspace = true
canic-management-protocol.workspace = true
canic-profile-protocol.workspace = true
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-wire.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
