[package]
name = "canic-qualification"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Installed Canic effect and product qualification"
# Helper modules beside these entrypoints are not standalone test crates.
autotests = false

[package.metadata.toko-tooling.loc]
category = "tests"

[features]
backup = ["canic-host/backup", "dep:ic-backup", "dep:ic-host-sign"]
profile-state = ["dep:canic-profile-worker", "dep:ic-storage"]

[dependencies]
canic-profile-worker = { workspace = true, optional = true }
ex-counter.workspace = true
ic-backup = { workspace = true, optional = true }
ic-host-artifacts.workspace = true
ic-host-sign = { workspace = true, optional = true }
ic-storage = { workspace = true, optional = true }
ic-testkit.workspace = true
ic-wire.workspace = true
wasmparser.workspace = true

[dev-dependencies]
canic = { workspace = true, features = ["db", "sharding"] }
canic-artifact-probe.workspace = true
canic-asset-catalog.workspace = true
canic-auth-witness.workspace = true
canic-effect-probe.workspace = true
canic-host.workspace = true
canic-management-protocol = { workspace = true, features = ["backup"] }
canic-profile-protocol.workspace = true
clap.workspace = true
ex-greeting.workspace = true
ic-auth.workspace = true
ic-auth-protocol-types.workspace = true
ic-host-process.workspace = true
ic-platform-crypto.workspace = true
ic-platform-protocol = { workspace = true, features = ["management-snapshots"] }
ic-testkit = { workspace = true, features = ["held-reply-fixtures"] }
ic-wasm-store-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync"] }
toko-tooling.workspace = true
toml.workspace = true

[[test]]
name = "artifact"

[[test]]
name = "auth"

[[test]]
name = "auth_browser"
required-features = ["profile-state"]

[[test]]
name = "backup"
path = "tests/backup/mod.rs"
required-features = ["backup"]

[[test]]
name = "blob"
required-features = ["profile-state"]

[[test]]
name = "creation"

[[test]]
name = "counter"

[[test]]
name = "endpoints"

[[test]]
name = "funding"

[[test]]
name = "growth"

[[test]]
name = "journey"

[[test]]
name = "maintenance"

[[test]]
name = "profile"

[[test]]
name = "publication"

[[test]]
name = "root"

[[test]]
name = "server"

[[test]]
name = "store"

[lints]
workspace = true
