[package]
name = "canic-qualification"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Installed Canic effect and product qualification"
# Helper modules beside these entrypoints are not standalone test crates.
autotests = false

[package.metadata.toko-tooling.loc]
category = "tests"

[features]
inspection = [
    "canic/inspection",
    "canic/role-verification",
    "example-user-directory-schema/inspection",
]
profile-state = ["canic-auth-witness/profile", "dep:canic-profile-worker", "dep:ic-storage"]

[dependencies]
canic = { workspace = true, features = ["endpoints"] }
canic-profile-worker = { workspace = true, optional = true }
example-counter.workspace = true
ic-host-artifacts.workspace = true
ic-storage = { workspace = true, optional = true }
ic-testkit.workspace = true
ic-wire.workspace = true
wasmparser.workspace = true

[dev-dependencies]
canic = { workspace = true, features = ["sharding"] }
canic-artifact-probe.workspace = true
canic-asset-catalog.workspace = true
canic-auth-witness.workspace = true
canic-effect-probe.workspace = true
canic-greeting-witness.workspace = true
canic-host.workspace = true
canic-management-protocol.workspace = true
canic-profile-protocol.workspace = true
clap.workspace = true
example-miner-pool-hub.workspace = true
example-user-directory-hub.workspace = true
example-user-directory-schema.workspace = true
example-user-directory-shard.workspace = true
ic-auth.workspace = true
ic-auth-protocol-types.workspace = true
ic-host-process.workspace = true
ic-platform-crypto.workspace = true
ic-platform-protocol = { workspace = true, features = ["management-snapshots", "registry-placement"] }
ic-testkit = { workspace = true, features = ["held-reply-fixtures"] }
ic-wasm-store-protocol.workspace = true
rustyline-async.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync"] }
toko-tooling.workspace = true
toml.workspace = true
wat.workspace = true

[[test]]
name = "artifact"

[[test]]
name = "auth"

[[test]]
name = "auth_browser"
required-features = ["profile-state"]

[[test]]
name = "blob"
required-features = ["profile-state"]

[[test]]
name = "creation"

[[test]]
name = "metrics_example"

[[test]]
name = "miner"

[[test]]
name = "notebook"

[[test]]
name = "counter"

[[test]]
name = "endpoints"

[[test]]
name = "funding"

[[test]]
name = "growth"

[[test]]
name = "journey"

[[test]]
name = "maintenance"

[[test]]
name = "profile"

[[test]]
name = "publication"

[[test]]
name = "root"

[[test]]
name = "server"

[[test]]
name = "store"

[[test]]
name = "inspection"
required-features = ["inspection"]

[[example]]
name = "user_directory_manifests"
required-features = ["inspection"]

[lints]
workspace = true
