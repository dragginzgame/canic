[workspace]
members = [
    "canic-artifact-probe",
    "canic-asset-catalog",
    "canic-auth-witness",
    "canic-db-witness",
    "canic-directory-witness",
    "canic-effect-probe",
    "canic-greeting-witness",
    "canic-profile-client",
    "canic-profile-entry",
    "canic-profile-manager",
    "canic-profile-protocol",
    "canic-profile-worker",
    "canic-qualification",
    "canic-schema-role",
    "canic-shard-hub",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "../LICENSE.md"
publish = false

[workspace.dependencies]
# Tests and tooling
canic = { path = "../crates/canic" }
canic-artifact-probe = { path = "canic-artifact-probe" }
canic-asset-catalog = { path = "canic-asset-catalog" }
canic-auth-witness = { path = "canic-auth-witness" }
canic-effect-probe = { path = "canic-effect-probe" }
canic-greeting-witness = { path = "canic-greeting-witness" }
canic-host = { path = "../crates/canic-host" }
canic-management = { path = "../crates/canic-management" }
canic-management-protocol = { path = "../crates/canic-management-protocol" }
canic-profile-protocol = { path = "canic-profile-protocol" }
canic-profile-worker = { path = "canic-profile-worker", default-features = false }
canic-qualification = { path = "canic-qualification" }
clap = { version = "4.6.7", features = ["derive"] }
ex-counter = { path = "../apps/examples/counter" }
ex-miner-pool-hub = { path = "../apps/examples/miner-pool/hub" }
ex-user-directory-hub = { path = "../apps/examples/user-directory/hub" }
ex-user-directory-schema = { path = "../apps/examples/user-directory/schema" }
ex-user-directory-shard = { path = "../apps/examples/user-directory/shard" }
ic-auth = { version = "0.49.0", features = ["receiver-memory", "ed25519-verification"] }
ic-auth-protocol-types = "0.44.0"
ic-backup = "0.105.5"
ic-db = "0.27.7"
ic-host-artifacts = { version = "0.80.3", default-features = false }
ic-host-fs = { version = "0.80.3", default-features = false }
ic-host-process = { version = "0.81.0", default-features = false }
ic-host-sign = "0.1.0"
ic-platform-crypto = { package = "ic-platform", version = "0.34.19", default-features = false, features = ["ed25519"] }
ic-platform-protocol = { version = "0.3.8", default-features = false }
ic-platform-runtime = { version = "0.23.25", default-features = false, features = ["entrypoint-macros", "system-raw"] }
ic-platform-types = { version = "0.21.4", default-features = false }
ic-storage = "0.78.0"
ic-testkit = { version = "0.110.0", default-features = false, features = ["managed-server"] }
ic-timers = "0.46.13"
ic-wasm-store-protocol = "0.8.0"
ic-wire = { version = "0.28.0", default-features = false }
rustyline-async = "0.4.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = { version = "3.27.0", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
toko-tooling = "=0.46.3"
toml = "1.2.1"
wasmparser = { version = "0.263.0", default-features = false, features = ["std", "validate", "features"] }
wat = "1.263.0"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
# Permit Platform's scoped generated-export expectation, not handwritten unsafe code.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
empty_line_after_doc_comments = "allow"

# This recipient also exercises the bounded inline install and upgrade path.
[profile.release.package.canic-directory-witness]
strip = "symbols"
