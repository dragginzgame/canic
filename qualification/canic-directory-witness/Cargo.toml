[package]
name = "canic-directory-witness"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Installed recipient of the managed fleet service directory"

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
funding = [
    "canic/sharding",
    "dep:canic-management",
    "dep:canic-management-protocol",
    "dep:ic-timers",
]
placement = ["canic/sharding", "ic-platform-types/principal-self-authenticating"]
role-probe = ["canic/role-attestation"]

[dependencies]
canic = { workspace = true, features = ["lifecycle", "method", "readiness", "topology", "storage"] }
canic-management = { workspace = true, optional = true }
canic-management-protocol = { workspace = true, features = ["standby"], optional = true }
ic-platform-runtime.workspace = true
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-timers = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
