[package]
name = "canic-profile-entry"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Retained profile discovery qualification fixture"

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
named-profile-witness = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
canic = { workspace = true, features = ["method", "storage"] }
canic-profile-protocol.workspace = true
ic-platform-runtime = { workspace = true, features = ["entrypoint-macros", "system-raw"] }
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
