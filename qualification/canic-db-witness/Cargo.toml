[package]
name = "canic-db-witness"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Installed typed Canic database composition witness"

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
fault-injection = ["canic/jobs", "canic/entropy", "dep:ic-timers"]
incompatible-schema = []
managed-fixture = []

[dependencies]
canic = { workspace = true, features = ["db-store"] }
ic-db.workspace = true
ic-platform-runtime.workspace = true
ic-storage.workspace = true
ic-timers = { workspace = true, optional = true, features = ["metrics"] }
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
canic-management-protocol.workspace = true
canic-qualification.workspace = true
ic-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toko-tooling.workspace = true
toml.workspace = true

[lints]
workspace = true
