[package]
name = "canic-db-witness"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Installed typed Canic database composition witness"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-db.workspace = true
ic-platform-runtime.workspace = true
ic-storage.workspace = true

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
fault-injection = []
incompatible-schema = []

[dependencies]
canic = { workspace = true, features = ["db-schema"] }
ic-wire.workspace = true
serde.workspace = true

[dev-dependencies]
canic-qualification.workspace = true
ic-testkit.workspace = true
tokio.workspace = true

[lints]
workspace = true
