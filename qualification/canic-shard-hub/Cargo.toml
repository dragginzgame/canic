[package]
name = "canic-shard-hub"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Installed consumer of Root shard placement"

[package.metadata.toko-tooling.loc]
category = "tests"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
canic = { workspace = true, features = ["lifecycle", "method", "readiness", "sharding", "storage"] }
canic-profile-protocol.workspace = true
ic-platform-runtime.workspace = true
ic-platform-types.workspace = true
ic-storage.workspace = true
ic-wire.workspace = true
serde.workspace = true
sha2.workspace = true

[dev-dependencies]
ex-miner-pool-hub.workspace = true
ex-user-directory-hub = { workspace = true, features = ["role-service"] }
toko-tooling.workspace = true

[[example]]
name = "miner-payer"
crate-type = ["cdylib"]

[[example]]
name = "registry-payer"
crate-type = ["cdylib"]

[lints]
workspace = true
