[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
candid = "0.10.36"
canic = { path = "../../../crates/canic", default-features = false }
canic-blob-service = { path = ".." }
ic-cdk = "0.20.3"
ic-memory = "0.28"
serde = { version = "1.0", features = ["derive"] }

[package]
name = "blob-service-embedded-consumer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.canic]
app = "embedded-app"
role = "backend"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
candid.workspace = true
canic = { workspace = true, features = [] }
canic-blob-service.workspace = true
ic-cdk.workspace = true
ic-memory.workspace = true
serde.workspace = true

[build-dependencies]
canic = { workspace = true, features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 8
incremental = false
