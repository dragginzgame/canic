[workspace]
# Tests and tooling packages
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"

[workspace.dependencies]
canic = { path = "../../../crates/canic", default-features = false }
canic-blob-service = { path = ".." }
ic-memory = "0.50.10"
# Tests and tooling only
ic-platform = { version = "0.6.7", default-features = false }
ic-storage = "0.50.10"
serde = { version = "1.0", features = ["derive"] }

[package]
name = "blob-service-embedded-consumer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.canic]
app = "embedded-app"
role = "backend"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
canic = { workspace = true, features = [] }
canic-blob-service.workspace = true
ic-memory.workspace = true
ic-platform = { workspace = true, features = ["cdk", "candid"] }
ic-storage.workspace = true
serde.workspace = true

[build-dependencies]
canic = { workspace = true, features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 8
incremental = false
