[workspace]
# Tests and tooling packages
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"

[workspace.dependencies]
canic = { path = "../../../crates/canic", default-features = false }
canic-blob-service = { path = "../../../crates/canic-blob-service" }
# Tests and tooling only
ic-host-artifacts = { version = "0.70.2", default-features = false }
ic-platform = { version = "0.8.2", default-features = false }

[package]
name = "blob-service-consumer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.canic]
app = "consumer-app"
role = "blob"

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
canic = { workspace = true, features = [] }
canic-blob-service.workspace = true
ic-platform = { workspace = true, features = ["cdk", "candid"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ic-host-artifacts = { workspace = true, features = ["wasm"] }

[build-dependencies]
canic = { workspace = true, features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 8
incremental = false

[features]
wire-schema = ["canic-blob-service/wire-schema"]

[[example]]
name = "wire_schema"
required-features = ["wire-schema"]
