[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
candid = "0.10.36"
canic = { path = "../../crates/canic", default-features = false }
ic-blob-storage = "=0.14.9"
ic-cdk = "0.20.3"
ic-memory = "0.25"

[package]
name = "canic-blob-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
test = false
doctest = false

[dependencies]
candid.workspace = true
canic = { workspace = true, features = [] }
ic-blob-storage.workspace = true
ic-cdk.workspace = true
ic-memory.workspace = true
