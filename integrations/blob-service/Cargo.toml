[package]
name = "canic-blob-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true
description = "Canic endpoint and lifecycle composition for the independent IC Blob service"
repository = "https://github.com/dragginzgame/canic"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]

[lib]
test = false
doctest = false

[features]
# Native producer only; deployed artifacts refuse this feature.
wire-schema = ["canic/wire-schema", "ic-blob-storage-contracts/wire-schema", "dep:ic-wire"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ic-wire = { workspace = true, optional = true, features = ["typescript"] }

[dependencies]
canic.workspace = true
ic-blob-storage.workspace = true
ic-blob-storage-contracts.workspace = true
ic-memory.workspace = true
ic-platform = { workspace = true, features = ["cdk", "candid"] }

[lints]
workspace = true
