[workspace]
members = [
    "apps/hello/canic-hello",
    "apps/profile/canic-profile-client",
    "apps/profile/canic-profile-entry",
    "apps/profile/canic-profile-manager",
    "apps/profile/canic-profile-protocol",
    "apps/profile/canic-profile-worker",
    "crates/canic",
    "crates/canic-cli",
    "crates/canic-host",
    "crates/canic-management",
    "crates/canic-management-protocol",
    "crates/canic-root",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.218.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
canic = { path = "crates/canic" }
canic-host = { path = "crates/canic-host" }
canic-management = { path = "crates/canic-management" }
canic-management-protocol = { path = "crates/canic-management-protocol" }
canic-profile-protocol = { path = "apps/profile/canic-profile-protocol" }
clap = { version = "4.6.7", features = ["derive"] }
ic-auth = { git = "https://github.com/dragginzgame/ic-auth", rev = "bfe2e548a997f10a876f01b4c72c4e5fec52c8d6", features = ["receiver-memory", "ed25519-verification"] }
ic-auth-protocol-types = { git = "https://github.com/dragginzgame/ic-auth", rev = "bfe2e548a997f10a876f01b4c72c4e5fec52c8d6" }
ic-auth-wire = { git = "https://github.com/dragginzgame/ic-auth", rev = "bfe2e548a997f10a876f01b4c72c4e5fec52c8d6" }
ic-blob-storage = "0.102.0"
ic-host-artifacts = "0.80.1"
ic-host-fs = { version = "0.80.1", default-features = false }
ic-host-process = { version = "0.80.2", default-features = false }
ic-host-text = { version = "0.77.2", default-features = false }
ic-platform = { version = "0.33.0", default-features = false }
ic-platform-ingress = { package = "ic-platform", version = "0.34.8", default-features = false, features = ["ingress-packets"] }
ic-platform-protocol = { version = "0.2.6", default-features = false }
ic-platform-runtime = { version = "0.23.14", default-features = false }
ic-platform-types = { version = "0.21.2", default-features = false }
ic-storage = "0.74.0"
ic-timers = "0.46.0"
ic-topology = { git = "https://github.com/dragginzgame/ic-query", rev = "12844b628d96bfd203ffbd900f10d02c4a896988", version = "0.107.0" }
ic-wasm-store = "0.3.0"
ic-wasm-store-protocol = "0.3.0"
ic-wire = { version = "0.24.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_cbor = "0.11.2"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.18"
time = { version = "0.3.55", default-features = false }
tiny_http = { version = "0.12.0", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
# Development tooling (source distribution; not a runtime dependency).
toko-tooling = "=0.44.11"
toml = "1.2.1"
url = "2.5.8"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
# Platform's generated IC exports carry a scoped unsafe-code expectation.
# Handwritten application unsafe code remains denied.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
