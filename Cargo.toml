[workspace]
members = [
    "apps/demo",
    "apps/demo/canic-hello",
    "crates/canic",
    "crates/canic-cli",
    "crates/canic-host",
    "crates/canic-management",
    "crates/canic-management-protocol",
    "crates/canic-root",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.221.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
canic = { path = "crates/canic" }
canic-host = { path = "crates/canic-host" }
canic-management = { path = "crates/canic-management" }
canic-management-protocol = { path = "crates/canic-management-protocol" }
clap = { version = "4.6.7", features = ["derive"] }
ic-auth = { version = "0.47.1", features = ["receiver-memory", "ed25519-verification"] }
ic-auth-protocol-types = "0.43.0"
ic-auth-wire = "0.43.0"
ic-backup = "0.105.5"
ic-blob-storage = "0.105.0"
ic-db = { git = "https://github.com/dragginzgame/ic-db", rev = "97e49f2ef7547cc4413ec75e9cea7d70c56735c1" }
ic-host-artifacts = "0.80.3"
ic-host-fs = { version = "0.80.3", default-features = false }
ic-host-process = { version = "0.81.0", default-features = false }
ic-host-sign = "0.1.0"
ic-host-text = { version = "0.77.2", default-features = false }
ic-platform = { version = "0.34.13", default-features = false, features = ["ingress-packets"] }
ic-platform-protocol = { version = "0.3.5", default-features = false }
ic-platform-runtime = { version = "0.23.16", default-features = false }
ic-platform-types = { version = "0.21.2", default-features = false }
ic-storage = "0.78.0"
ic-timers = "0.46.3"
ic-topology = "0.109.2"
ic-wasm-store = "0.4.0"
ic-wasm-store-protocol = "0.4.0"
ic-wire = { version = "0.24.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.18"
time = { version = "0.3.55", default-features = false }
tiny_http = { version = "0.12.0", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
# Development tooling (source distribution; not a runtime dependency).
toko-tooling = "=0.45.3"
toml = "1.2.1"
toml_edit = "0.25.19"
url = "2.5.8"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
# Platform's generated IC exports carry a scoped unsafe-code expectation.
# Handwritten application unsafe code remains denied.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
