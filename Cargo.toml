[workspace]
members = [
    "apps/hello/canister",
    "apps/profile/client",
    "apps/profile/entry",
    "apps/profile/manager",
    "apps/profile/protocol",
    "apps/profile/worker",
    "crates/canic",
    "crates/canic-cli",
    "crates/canic-host",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.200.1"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
canic = { path = "crates/canic" }
canic-host = { path = "crates/canic-host" }
canic-profile-protocol = { path = "apps/profile/protocol" }
clap = { version = "4.6.7", features = ["derive"] }
ic-host-fs = { version = "0.77.1", default-features = false }
ic-host-process = { version = "0.77.1", default-features = false }
ic-host-text = { version = "0.75.0", default-features = false }
ic-platform = { version = "0.33.0", default-features = false }
ic-platform-runtime = { version = "0.22.1", default-features = false }
ic-storage = "0.74.0"
ic-timers = "0.44.1"
ic-wire = { version = "0.22.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tiny_http = { version = "0.12.0", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
# Development tooling (source distribution; not a runtime dependency).
toko-tooling = "=0.43.0"
url = "2.5.8"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
