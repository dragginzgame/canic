[workspace]
members = [
    "apps/examples/counter",
    "apps/examples/metrics",
    "apps/examples/miner-pool/hub",
    "apps/examples/miner-pool/miner",
    "apps/examples/notebook",
    "apps/examples/user-directory/hub",
    "apps/examples/user-directory/schema",
    "apps/examples/user-directory/shard",
    "apps/template",
    "crates/canic",
    "crates/canic-cli",
    "crates/canic-dormant",
    "crates/canic-host",
    "crates/canic-macros",
    "crates/canic-management",
    "crates/canic-management-protocol",
    "crates/canic-root",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.276.0"
edition = "2024"
rust-version = "1.100.0"
repository = "https://github.com/dragginzgame/canic"
license-file = "LICENSE.md"
publish = ["crates-io"]

[workspace.dependencies]
# Production
base64 = "0.23.1"
canic-host = { path = "crates/canic-host", version = "0.276.0" }
canic-macros = { path = "crates/canic-macros", version = "0.276.0" }
canic-management = { path = "crates/canic-management", version = "0.276.0" }
canic-management-protocol = { path = "crates/canic-management-protocol", version = "0.276.0" }
clap = { version = "4.6.7", features = ["derive"] }
example-user-directory-schema = { path = "apps/examples/user-directory/schema" }
ic-auth = "0.51.1"
ic-auth-protocol-types = "0.44.2"
ic-auth-wire = "0.50.0"
ic-blob-storage = "0.113.1"
ic-db = "0.34.0"
ic-entropy = { version = "0.7.0", default-features = false }
ic-host-artifacts = "0.80.3"
ic-host-fs = { version = "0.80.3", default-features = false }
ic-host-process = { version = "0.81.0", default-features = false }
ic-host-text = { version = "0.77.4", default-features = false }
ic-jobs = { version = "0.39.11", default-features = false }
ic-logging = "0.26.0"
ic-metrics = "0.30.20"
ic-platform-protocol = { version = "0.3.11", default-features = false }
ic-platform-runtime = { version = "0.23.27", default-features = false }
ic-platform-types = { version = "0.21.6", default-features = false }
ic-testkit = { version = "0.110.3", default-features = false }
ic-timers = "0.46.13"
ic-wasm-store = "0.11.0"
ic-wasm-store-protocol = "0.11.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde_bytes = "0.11.19"
sha2 = "0.11.1"
syn = { version = "3", features = ["full", "visit"] }
tempfile = { version = "3.27.0", default-features = false }
thiserror = "2.0.18"
time = { version = "0.3.55", default-features = false }
tiny_http = { version = "0.12.0", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
toml_edit = "0.25.19"
url = "2.5.8"
wasmparser = { version = "0.263.0", default-features = false, features = ["std"] }

# Production and tests
canic = { path = "crates/canic", version = "0.276.0" }
ic-platform = { version = "0.35.1", default-features = false }
ic-query-topology = "0.110.6"
ic-storage = "0.80.0"
ic-wire = { version = "0.31.1", default-features = false }
inventory = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

# Tests and tooling
toko-tooling = "=0.46.9"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
# Platform's generated IC exports carry a scoped unsafe-code expectation.
# Handwritten application unsafe code remains denied.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
empty_line_after_doc_comments = "allow"
