[workspace]
members = [
    "apps/hello/canic-hello",
    "apps/profile/canic-profile-client",
    "apps/profile/canic-profile-entry",
    "apps/profile/canic-profile-manager",
    "apps/profile/canic-profile-protocol",
    "apps/profile/canic-profile-worker",
    "crates/canic",
    "crates/canic-cli",
    "crates/canic-host",
    "crates/canic-management",
    "crates/canic-management-protocol",
    "crates/canic-root",
]
exclude = ["qualification"]
resolver = "3"

[workspace.package]
version = "0.217.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
base64 = "0.23.1"
canic = { path = "crates/canic" }
canic-host = { path = "crates/canic-host" }
canic-management = { path = "crates/canic-management" }
canic-management-protocol = { path = "crates/canic-management-protocol" }
canic-profile-protocol = { path = "apps/profile/canic-profile-protocol" }
clap = { version = "4.6.7", features = ["derive"] }
ic-auth = { git = "https://github.com/dragginzgame/ic-auth", rev = "b78991e9833320692921bf766e51ad361c9c8c4d", features = ["receiver-memory", "ed25519-verification"] }
ic-auth-protocol-types = { git = "https://github.com/dragginzgame/ic-auth", rev = "b78991e9833320692921bf766e51ad361c9c8c4d" }
ic-auth-wire = { git = "https://github.com/dragginzgame/ic-auth", rev = "b78991e9833320692921bf766e51ad361c9c8c4d" }
ic-blob-storage = { git = "https://github.com/dragginzgame/ic-blob-storage", rev = "decde204acb6d7c8362a0003e904beef72ff89b6" }
ic-host-artifacts = "0.80.1"
ic-host-fs = { version = "0.80.1", default-features = false }
ic-host-process = { version = "0.80.2", default-features = false }
ic-host-text = { version = "0.76.0", default-features = false }
ic-platform = { version = "0.33.0", default-features = false }
ic-platform-runtime = { version = "0.22.1", default-features = false }
ic-storage = "0.74.0"
ic-timers = "0.45.10"
ic-topology = { git = "https://github.com/dragginzgame/ic-query", rev = "0a3eca919f05d777798406087049cc51ab7ae2a8", version = "0.106.1" }
ic-wasm-store = "0.2.3"
ic-wasm-store-protocol = "0.2.3"
ic-wire = { version = "0.24.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false }
tiny_http = { version = "0.12.0", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
# Development tooling (source distribution; not a runtime dependency).
toko-tooling = "=0.44.6"
toml = "1.2.1"
url = "2.5.8"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
